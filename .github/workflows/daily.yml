name: daily refresh + watch

# One pipeline, two modes:
#   full  — once a day after 06:00 UTC: everything, including the external lookups (focus wallet ETH history, gas
#           funders) and the files only the full run commits (wallets.json, the Visualizer's graph).
#   light — about every 4 hours: new transfers, clusters, entity registry (follow the coins), watch, terminal data.
# GitHub starts scheduled runs late or not at all under load (the old fixed 06:23 full run started at 12:46–14:43 UTC
# for a week, up to half the light runs were dropped, and a new hourly "41 * * * *" did not fire once in 5.5 hours on
# 8 Nov). So the schedule is a tick twice an hour, and the plan job decides
# from the data commits whether this tick does a full run, a light run or nothing (scripts/plan-run.mjs). Ticks that
# do nothing finish in seconds; a dropped tick is covered by the next one.
on:
  schedule:
    - cron: "7,37 * * * *"   # tick twice an hour: the plan job decides full / light / skip
  workflow_dispatch:
    inputs:
      mode:
        description: "full or light"
        default: full
        type: choice
        options: [full, light]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.p.outputs.mode }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/plan-run.mjs
          sparse-checkout-cone-mode: false
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "manual run: ${{ inputs.mode }}"; echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/${{ github.repository }}/commits?path=data/terminal.json&per_page=40" > commits.json
          gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=20" > runs.json
          node scripts/plan-run.mjs commits.json runs.json "${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # on the job, not the workflow: a tick that skips must not wait behind (or cancel) a queued refresh
    concurrency:
      group: gme-daily
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        run: echo "running in $MODE mode"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The full transfer history and the pools' swap history live as release assets (tag gme-archive), not in git.
      # No asset yet, or an archive from before transfers carried their transaction hash: pull everything (~20 min).
      - name: Get transfer archive
        run: |
          FULL=0
          if gh release download gme-archive -p transfers.csv.gz -D data --clobber && gh release download gme-archive -p swaps.csv.gz -D data --clobber; then
            gunzip -f data/transfers.csv.gz data/swaps.csv.gz
            head -1 data/transfers.csv | grep -q ",tx,li" || { echo "archive without tx hashes: full re-pull"; FULL=1; }
          else
            echo "archive or swaps asset missing: full pull"; FULL=1
          fi
          if [ "$FULL" = 1 ]; then
            python3 scripts/pull-transfers-rpc.py --start-block=19858481 --out=data/transfers.csv --swaps=data/swaps.csv --log=data/pull.log
          fi
          echo "archive rows: $(($(wc -l < data/transfers.csv) - 1)) · swaps: $(($(wc -l < data/swaps.csv) - 1))"

      - name: Pull new transfers and merge
        run: |
          MAX=$(python3 scripts/archive_tools.py maxblock data/transfers.csv)
          python3 scripts/pull-transfers-rpc.py --start-block=$MAX --out=data/delta.csv --swaps=data/delta_swaps.csv --log=data/pull.log
          python3 scripts/archive_tools.py merge data/transfers.csv data/delta.csv
          python3 scripts/archive_tools.py merge data/swaps.csv data/delta_swaps.csv

      - name: Prices
        run: |
          python3 scripts/pull-prices-defillama.py --out=data/prices.csv
          python3 scripts/pull-eth-prices.py data/eth_prices.csv

      # Exact execution price of every DEX trade from the pools' Swap events (data/trade_px.csv, used by entities,
      # crowd and terminal; trades without a swap keep the day's close).
      - name: Exact trade prices
        continue-on-error: true
        run: python3 scripts/trades.py

      - name: Classify new addresses (contract or wallet)
        run: python3 scripts/getcode.py

      - name: Rebuild exclude list
        run: python3 scripts/build_exclude.py

      - name: Refresh the focus wallet's ETH transfers
        if: env.MODE == 'full'
        continue-on-error: true
        run: python3 scripts/refresh_focus.py

      - name: Clusters
        run: |
          python3 scripts/cluster.py
          python3 scripts/coinbase_group.py
          python3 scripts/cluster_all.py
          python3 scripts/vaults90.py

      - name: Quiet accumulators
        run: python3 scripts/stealth.py

      - name: Gas funders of watched wallets (Ethplorer)
        if: env.MODE == 'full'
        continue-on-error: true
        run: python3 scripts/funders_ethplorer.py data/watch_addrs.txt

      - name: Quiet accumulators (with gas links)
        if: env.MODE == 'full'
        run: python3 scripts/stealth.py

      - name: Float and market
        run: |
          python3 scripts/float.py
          python3 scripts/market.py

      - name: Exchange overhang
        continue-on-error: true
        run: python3 scripts/overhang.py

      - name: Cohorts
        continue-on-error: true
        run: python3 scripts/cohorts.py

      - name: Metrics engine (realized price, MVRV, URPD, holding age)
        continue-on-error: true
        run: |
          python3 -c "
          import json
          t = json.load(open('data/addr-types.json'))
          json.dump({'types': {a: ('contract' if v == 'contract' else 'eoa') for a, v in t.items()}}, open('data/addr-types-engine.json', 'w'))"
          node scripts/build-onchain-local.mjs --transfers=data/transfers.csv --prices=data/prices.csv --decimals=9 --daily \
            --threshold=155 --whale_min=100000000 --whale_days=30 --urpdhist_stride=1 \
            --out=data/engine/onchain.json --urpd=data/engine/urpd.json --addrtypes=data/addr-types-engine.json

      # Entities with stable ids; follows coins into fresh wallets (seed / drain rules); tripwires since the last run.
      - name: Entity registry
        run: python3 scripts/entities.py

      # The Visualizer's transfer graph (every pair, per month). ~4.5 MB, so like wallets.json it is only committed by
      # the full daily run.
      - name: Visualizer graph
        continue-on-error: true
        run: python3 scripts/graph.py

      # ETH side: who signed new purchases into study wallets (public nodes, incremental), then the ETH study from the
      # committed BigQuery results (data/bq, refreshed by the manual bigquery.yml workflow).
      - name: ETH side
        continue-on-error: true
        run: |
          [ -f data/bq/wallets.csv ] || exit 0
          timeout 20m python3 scripts/signers_rpc.py || true
          python3 scripts/ethside.py

      # Owner-level crowd behaviour: who buys (new / returning / adding), who sells or exits (profit / loss), cohorts, smart money.
      - name: Crowd behaviour
        continue-on-error: true
        run: python3 scripts/crowd.py

      - name: Watch (alerts since last run)
        run: python3 scripts/watch.py

      - name: Terminal data (daily series, insider watch, wallet histories)
        continue-on-error: true
        run: python3 scripts/terminal.py

      # Data first: the site only needs data/, so a GitHub hiccup on the archive upload can't block it.
      - name: Commit data
        run: |
          git config user.name "gme-terminal bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # graph.json and graph_tx.json must move together: the ledger addresses nodes by their index in graph.json,
          # so committing one without the other would point every ledger row at the wrong wallet.
          if [ "$MODE" = "light" ]; then git checkout HEAD -- data/wallets.json data/graph.json data/graph_tx.json 2>/dev/null || true; fi
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          if [ "$MODE" = "light" ]; then git commit -m "data: refresh $(date -u +'%F %H:%M') UTC (light)"; else git commit -m "data: daily refresh $(date -u +%F)"; fi
          # main may have moved while this ran (a code push); the data commit only touches data/, so rebase onto it.
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done; exit 1

      # High alerts and entity tripwires go to one open issue ("GME terminal alerts"), so GitHub notifies the owner.
      # Set the repository variable ALERT_ISSUE=off to stop it.
      - name: Notify
        if: vars.ALERT_ISSUE != 'off'
        continue-on-error: true
        run: |
          python3 scripts/notify.py
          [ -f data/alerts/notify.md ] || exit 0
          # list API (not search: a new issue takes minutes to reach the search index)
          N=$(gh issue list --state open --limit 100 --json number,title -q '.[] | select(.title == "GME terminal alerts") | .number' | head -1)
          if [ -z "$N" ]; then
            URL=$(gh issue create -t "GME terminal alerts" -b "The scheduled job comments here when a watched group or entity trips an alert. Close the issue or set the repository variable ALERT_ISSUE=off to stop.")
            N=${URL##*/}
          fi
          gh issue comment "$N" -F data/alerts/notify.md

      # The archive only saves the next run from re-pulling: if the upload fails (GitHub 5xx), the old asset stays
      # and the next run pulls a slightly bigger delta. Retried, and never fails the run.
      - name: Upload archive
        continue-on-error: true
        run: |
          gzip -kf data/transfers.csv data/swaps.csv
          gh release view gme-archive >/dev/null 2>&1 || \
            gh release create gme-archive -t "Transfer archive" -n "Full GME transfer history (sender,receiver,time,value,block). Updated daily by the workflow."
          for i in 1 2 3; do
            gh release upload gme-archive data/transfers.csv.gz data/swaps.csv.gz --clobber && exit 0
            echo "upload attempt $i failed; retrying"; sleep $((20 * i))
          done
          echo "::warning::archive upload failed 3 times; the previous archive is kept and the next run pulls a bigger delta"
          exit 1
