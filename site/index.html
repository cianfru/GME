<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a12">
<title>GME on Ethereum · Terminal</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>try { const t = localStorage.getItem("gme-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root { --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --blur: blur(18px) saturate(1.45); --gut: max(16px, env(safe-area-inset-left, 0px)); --max: 1440px }
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #e7ecf4;
  --bg-grad: radial-gradient(1100px 680px at 6% -8%, rgb(230 186 90 / .34), transparent 62%), radial-gradient(1000px 720px at 104% 4%, rgb(96 140 235 / .30), transparent 60%),
    radial-gradient(900px 700px at 70% 112%, rgb(52 180 160 / .22), transparent 62%), linear-gradient(180deg, #eef2f8 0%, #e1e7f0 100%);
  --glass: rgb(255 255 255 / .58); --glass-2: rgb(255 255 255 / .55); --glass-hdr: rgb(246 248 252 / .72); --glass-pop: rgb(255 255 255 / .92); --th: rgb(248 250 253 / .97);
  --line: rgb(15 23 42 / .10); --line-2: rgb(15 23 42 / .22); --hi: rgb(255 255 255 / .95); --grid: rgb(15 23 42 / .07); --gridbg: rgb(15 23 42 / .04); --corner: rgb(15 23 42 / .5);
  --fg: #0b1220; --fg-2: #434d5e; --muted: #667085; --row: rgb(15 23 42 / .04);
  --accent: #9a6f0b; --accent-2: rgb(154 111 11 / .12);
  --up: #0a8a3a; --down: #c93636; --warn: #c0650f; --crit: #d03b3b; --neutral: #a3abb8;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --shadow: 0 30px 60px -40px rgb(15 23 42 / .35);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #060a12;
  --bg-grad: radial-gradient(1100px 680px at 6% -8%, rgb(214 168 72 / .20), transparent 62%), radial-gradient(1000px 720px at 104% 4%, rgb(58 108 206 / .28), transparent 60%),
    radial-gradient(900px 700px at 70% 112%, rgb(32 150 138 / .18), transparent 62%), linear-gradient(180deg, #060a12 0%, #0a1122 100%);
  --glass: rgb(16 24 40 / .52); --glass-2: rgb(255 255 255 / .035); --glass-hdr: rgb(7 11 20 / .66); --glass-pop: rgb(13 20 34 / .9); --th: rgb(13 20 34 / .97);
  --line: rgb(255 255 255 / .085); --line-2: rgb(255 255 255 / .17); --hi: rgb(255 255 255 / .07); --grid: rgb(255 255 255 / .055); --gridbg: rgb(255 255 255 / .03); --corner: rgb(255 255 255 / .45);
  --fg: #e8edf5; --fg-2: #a9b3c4; --muted: #75819a; --row: rgb(255 255 255 / .04);
  --accent: #d6b15a; --accent-2: rgb(214 177 90 / .13);
  --up: #48c287; --down: #f0706b; --warn: #ee9244; --crit: #f05f5c; --neutral: #5a667c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 30px 60px -36px rgb(0 0 0 / .8);
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; background: var(--bg) }
body { margin: 0; min-height: 100vh; color: var(--fg); font: 14px/1.5 var(--sans); overflow-x: hidden; -webkit-font-smoothing: antialiased; background: transparent }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: var(--bg-grad); pointer-events: none }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--gridbg) 1px, transparent 1px), linear-gradient(90deg, var(--gridbg) 1px, transparent 1px); background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 85%); mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 85%) }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2) }
button { font: inherit; color: inherit; border-radius: 0 }
input, select { border-radius: 0 }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px }
.mono, .num, td.n, .axis text { font-family: var(--mono); font-variant-numeric: tabular-nums }
.eyebrow { font: 500 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.up { color: var(--up) } .down { color: var(--down) } .flat { color: var(--muted) } .mv-move { color: var(--warn) }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gut) }

/* glass + sharp corners */
.panel { position: relative; min-width: 0; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hi), var(--shadow) }
.panel::after { content: ""; position: absolute; inset: -1px; pointer-events: none; --c: var(--corner); --s: 10px;
  background: linear-gradient(var(--c), var(--c)) top left / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) top left / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) top right / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) top right / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom left / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom right / 1px var(--s) no-repeat }
.panel.key::after { --c: var(--accent); --s: 14px }

/* header */
.hdr { position: sticky; top: 0; z-index: 30; background: var(--glass-hdr); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid var(--line) }
.hbar { display: flex; align-items: center; gap: 1.6rem; max-width: var(--max); margin: 0 auto; padding: 0 var(--gut); height: 56px }
.brand { display: flex; align-items: center; gap: .6rem; color: var(--fg); text-decoration: none; font: 600 12px var(--sans); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap }
.brand img { width: 24px; height: 24px; display: block }
.brand span { color: var(--muted); font-weight: 500 }
.nav { display: flex; gap: 1.7rem; flex: 1; min-width: 0; align-self: stretch }
.nav a { position: relative; display: flex; align-items: center; font: 500 11.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .15s }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .22s ease }
.nav a:hover { color: var(--fg-2) } .nav a.on { color: var(--fg) } .nav a.on::after { transform: scaleX(1) }
.hstat { display: inline-flex; align-items: center; gap: .45rem; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); white-space: nowrap; padding: 0 .65rem; height: 30px; border: 1px solid var(--line) }
.hstat i, .dstat i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-2); display: inline-block; flex: none }
.hstat.stale, .dstat.stale { color: var(--accent) } .hstat.stale { border-color: var(--accent) } .hstat.stale i, .dstat.stale i { background: var(--accent) }
.tbtn { background: none; border: 1px solid var(--line); height: 30px; padding: 0 .7rem; font: 500 10.5px var(--mono); letter-spacing: .12em; color: var(--muted); cursor: pointer }
.tbtn:hover { color: var(--fg) }
/* eight sections: tighten the header, then give the nav its own row before it can run under the status */
@media (max-width: 1340px) { .nav { gap: 1.15rem } .nav a { letter-spacing: .1em } .brand span, .hs-age { display: none } }
@media (max-width: 1180px) {
  .hbar { flex-wrap: wrap; height: auto; padding-top: 10px; gap: 8px 10px }
  .brand { flex: 1 }
  .nav { order: 3; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; gap: 1.3rem; height: 42px; margin: 0 calc(-1 * var(--gut)); padding: 0 var(--gut) }
  .nav::-webkit-scrollbar { display: none }
}
@media (max-width: 900px) {
  .hbar { flex-wrap: wrap; height: auto; padding-top: 10px; gap: 8px 10px }
  .brand { flex: 1 }
  .nav { order: 3; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; gap: 1.3rem; height: 42px; margin: 0 calc(-1 * var(--gut)); padding: 0 var(--gut) }
  .nav::-webkit-scrollbar { display: none }
  .hs-age, .brand span, .hs-pre { display: none }
  .prov .pd { display: none }
  .contract .full { display: none }
  .hero { gap: 12px }
  .hstat, .tbtn { height: 34px }
}

/* hero + metrics */
.hero { padding: 46px 0 22px; display: grid; gap: 16px }
.sline { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .8rem; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.sline .sep { opacity: .45 }
.dstat { display: inline-flex; align-items: center; gap: .45rem; color: var(--fg-2) }
.hero h1 { margin: 6px 0 0; font: 600 clamp(34px, 5.6vw, 64px)/.98 var(--sans); letter-spacing: .015em; text-transform: uppercase }
.hero h1 span { color: var(--muted); font-weight: 500 }
.lede { margin: 0; font: 400 clamp(15px, 1.5vw, 18px)/1.45 var(--sans); color: var(--fg-2); max-width: 48ch }
.contract { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; font-size: 12px }
.contract .mono { color: var(--fg-2); word-break: break-all }
.contract .shortc { display: none }
@media (max-width: 900px) { .contract .shortc { display: inline } }
.mini { background: none; border: 1px solid var(--line); padding: 0 .55rem; height: 26px; display: inline-flex; align-items: center; font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); cursor: pointer; text-decoration: none; white-space: nowrap }
.mini:hover { color: var(--fg); border-color: var(--line-2) }
.prov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px }
.prov > div { padding: 14px 18px; display: flex; flex-direction: column; gap: 5px }
.prov > div + div { border-left: 1px solid var(--line) }
.prov p { margin: 0; font-size: 13px; color: var(--fg-2) }
.more { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 1px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap }
.more:hover { color: var(--accent) }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden }
.mtoggle + .grid, .metrics + .mtoggle + .grid { margin-top: 14px }
.metrics .m { padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 3px; min-width: 0; box-shadow: 1px 1px 0 var(--line) }
.mk { font: 500 10px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); cursor: help; width: fit-content; border-bottom: 1px dotted var(--line-2) }
.mv { font: 500 22px/1.2 var(--mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.md { font: 400 11.5px/1.35 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mtoggle { display: none }
@media (max-width: 760px) {
  .hero { padding-top: 26px }
  .prov { grid-template-columns: minmax(0, 1fr) } .prov > div + div { border-left: 0; border-top: 1px solid var(--line) }
  .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)) } .metrics .m { padding: 13px 14px } .mv { font-size: 19px } .md { white-space: normal }
  .metrics.collapsed .m.sec { display: none }
  .mtoggle { display: flex; width: 100%; justify-content: center; margin-top: -1px }
}

/* page head, sections, grids */
.phead { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px 28px; padding: 38px 0 20px }
.phead h1 { margin: 8px 0 8px; font: 600 clamp(26px, 3.4vw, 40px)/1.05 var(--sans); letter-spacing: .005em }
.phead p { margin: 0; color: var(--fg-2); max-width: 70ch }
.sect { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1rem; margin: 36px 0 14px; padding-top: 14px; border-top: 1px solid var(--line) }
.sect h2 { margin: 0; font: 600 12.5px var(--sans); letter-spacing: .16em; text-transform: uppercase }
.sect p { margin: 0; color: var(--muted); font-size: 12.5px; flex-basis: 100% }
@media (min-width: 900px) { .sect p { flex-basis: auto } }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.grid + .grid { margin-top: 14px }
.wide { grid-column: 1 / -1 }
@media (max-width: 1100px) { .grid.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 860px) { .grid, .grid.c3 { grid-template-columns: minmax(0, 1fr) } }
main { padding-bottom: 60px }
/* public landing hero */
.hp-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 40px; align-items: end }
.hp-top h1 { margin: 6px 0 0 }
.hp-mc { text-align: right; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.hp-mc b { font: 600 clamp(38px, 5.4vw, 68px)/1 var(--mono); letter-spacing: -.02em }
.hp-mc span { font: 500 12px var(--mono); color: var(--fg-2) }
.hp-read { margin: 0; font: 400 clamp(15px, 1.5vw, 18px)/1.5 var(--sans); color: var(--fg-2); max-width: 70ch }
.hp-read b { color: var(--fg); font-weight: 600 }
.zchip { display: inline-block; padding: 1px 8px 2px; border-left: 3px solid var(--zc, var(--accent)); background: color-mix(in srgb, var(--zc, var(--accent)) 16%, transparent); color: var(--fg); font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap }
.hp-chart { padding: 14px 16px 12px }
.hp-chead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 6px }
.hp-chead .seg { display: inline-flex; gap: 0 }
.hp-chead .mini.on { border-color: var(--accent); color: var(--accent) }
#hpc { position: relative; touch-action: pan-y }
#hpc svg { display: block; width: 100%; overflow: visible }
.hp-key { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2) }
.hp-key i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px }
.hp-key .ln { width: 16px; height: 0; border-top: 2px solid var(--fg); vertical-align: 3px }
.hp-key .ln.d { border-top: 2px dashed var(--accent) }
.hp-cta { display: flex; flex-wrap: wrap; gap: 8px }
.hp-cta a { padding: 9px 14px; border: 1px solid var(--line); font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); text-decoration: none; background: color-mix(in srgb, var(--fg) 4%, transparent) }
.hp-cta a.pri { border-color: var(--accent); color: var(--accent) }
.hp-cta a:hover { background: color-mix(in srgb, var(--accent) 14%, transparent) }
@media (max-width: 720px) {
  .hp-top { grid-template-columns: 1fr } .hp-mc { text-align: left } .hp-chart { padding: 10px 8px 10px }
  .hp-cta a { flex: 1 1 auto; text-align: center }
}
#view.enter .panel, #view.enter .phead, #view.enter .hero > *, #view.enter .sect { animation: enter .28s ease-out }
@keyframes enter { from { opacity: 0; transform: translateY(6px) } }

/* cards */
.card { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem 1rem; flex-wrap: wrap }
.ph h3 { margin: 0; font: 500 10.5px/1.4 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--fg-2) }
.ph .q { margin: 5px 0 0; font: 500 16px/1.35 var(--sans); color: var(--fg) }
.pv { font: 500 17px/1.2 var(--mono); white-space: nowrap; letter-spacing: -.01em }
.pv small { font-size: 11.5px; margin-left: .45rem }
.sub { margin: 0; color: var(--fg-2); font-size: 13px; max-width: 86ch }
details.about { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px }
details.about summary { cursor: pointer; list-style: none; font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); width: fit-content }
details.about summary::-webkit-details-marker { display: none }
details.about summary::before { content: "+ " } details.about[open] summary::before { content: "− " }
details.about summary:hover { color: var(--fg-2) }
details.about p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; max-width: 90ch }
.chart { position: relative; width: 100%; min-height: 120px }
.chart svg { display: block; width: 100%; overflow: visible }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; font-size: 12px; color: var(--fg-2) }
.legend:empty { display: none }
.legend > .tw { min-width: 0; flex: 1 1 100% }
@media (max-width: 760px) { .pv { white-space: normal; max-width: 100% } }
.legend span { display: inline-flex; align-items: center; gap: .45rem }
.legend i { width: 9px; height: 9px; flex: none }
.legend i.ln { height: 2px; width: 14px }
.legend i.dash { height: 0; width: 16px; border-top: 2px dashed; background: none !important }
.axis text { font-size: 10px; fill: var(--muted) }
.axis line { stroke: var(--line) } .axis .domain { display: none }
.gridl line { stroke: var(--grid) } .gridl .domain { display: none }
.lbl { font: 500 10.5px var(--sans); fill: var(--fg-2) }
.plabel { font: 500 9.5px var(--mono); letter-spacing: .13em; text-transform: uppercase; fill: var(--muted) }
.xhair { stroke: var(--fg-2); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none }
/* zoomable time series: navigator strip, drag selection, reset, full-screen viewer */
.tscard { position: relative } .tscard > .ph { padding-right: 46px }
.xbtn { position: absolute; z-index: 2; top: 14px; right: 14px; width: 32px; height: 32px; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line-2); color: var(--fg-2); font: 500 16px/1 var(--mono); cursor: pointer }
.xbtn:hover { color: var(--accent); border-color: var(--accent) }
.tsn { margin-top: 2px } .tsn svg { display: block; width: 100%; touch-action: none; overflow: visible }
.tsn .navbg { fill: var(--glass-2); stroke: var(--line) } .tsn .navax text { font-size: 9.5px } .tsn .navax .domain { display: none }
.tsn .brush .selection { fill: var(--accent); fill-opacity: .16; stroke: var(--accent); stroke-opacity: .8; shape-rendering: crispEdges }
.tsn .brush .overlay { cursor: pointer } .tsn .grips rect { fill: var(--accent) }
.zsel { fill: var(--accent); fill-opacity: .14; stroke: var(--accent); stroke-opacity: .6; pointer-events: none }
.zrs { background: var(--accent-2); border: 1px solid var(--accent); color: var(--accent); font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px; cursor: pointer; min-height: 28px }
#tip .tiphint { margin: .35rem 0 0; color: var(--muted); font-size: 11px }
.tsv { position: fixed; inset: 0; z-index: 55; background: rgb(3 7 18 / .72); display: flex; padding: 12px }
.tsv[hidden] { display: none } body.tsvopen { overflow: hidden }
.tsvbox { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: var(--glass-pop) }
.tsvbox .ph { flex: none } .tsvr { display: flex; align-items: center; gap: 12px } .tsvbox #tsvc { flex: 1; min-height: 0; overflow: hidden } .tsvbox .legend, .tsvh { flex: none } .tsvh { margin: 0 }
@media (max-width: 760px) { .tsv { padding: 0 } .tsvbox { padding: 12px } .tsvr .pv { display: none } .xbtn { top: 10px; right: 10px; width: 38px; height: 38px } }
.empty { border: 1px dashed var(--line-2); padding: 18px; display: flex; flex-direction: column; gap: 4px }
.empty p { margin: 0; color: var(--fg-2); font-size: 13px }

/* segmented controls */
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--glass-2); flex: none; max-width: 100%; overflow-x: auto; scrollbar-width: none }
.seg::-webkit-scrollbar { display: none } .seg button { white-space: nowrap; flex: none }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: 0 .75rem; height: 32px; font: 500 10.5px var(--mono); letter-spacing: .1em; color: var(--muted); cursor: pointer; transition: color .15s, background .15s }
.seg button:last-child { border-right: 0 } .seg button:hover { color: var(--fg-2) }
.seg button.on { color: var(--fg); background: var(--accent-2); box-shadow: inset 0 -1px 0 var(--accent) }
@media (max-width: 760px) { .seg button { height: 40px; padding: 0 .65rem } }
.ctl { display: flex; flex-wrap: wrap; gap: .55rem .8rem; align-items: center }
.chip { background: var(--glass-2); border: 1px solid var(--line); padding: 0 .75rem; height: 32px; font: 500 12px var(--sans); color: var(--fg-2); cursor: pointer; transition: border-color .15s, color .15s }
.chip.on { border-color: var(--accent); color: var(--fg) }
.chip b { font: 500 11.5px var(--mono); margin-left: .25rem }
@media (max-width: 760px) { .chip { height: 40px } }
input.q, select.q { background: var(--glass-2); border: 1px solid var(--line); color: var(--fg); padding: 0 .65rem; height: 32px; font: 400 12.5px var(--sans); min-width: 0 }
input.q { width: 15rem; max-width: 100% } select.q { max-width: 100% }
/* pool and overhang calculator */
.calcctl { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px 28px; align-items: start }
.calcctl .cg { display: flex; flex-direction: column; gap: 7px; min-width: 0 } .calcctl .cgr { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.calcctl #cmi { width: 8.5rem; font: 500 13px var(--mono) } .calcctl .sub { margin: 0 }
.calcctl input[type="range"] { width: 100%; margin: 2px 0; accent-color: var(--accent); height: 22px; cursor: pointer }
.calcch svg { user-select: none; -webkit-user-select: none } .calcch .calc-lab { font: 500 11px var(--mono) }
@media (max-width: 760px) { .calcctl { grid-template-columns: minmax(0, 1fr) } .calcctl input[type="range"] { height: 30px } }
@media (max-width: 760px) { input.q, select.q { height: 40px; width: 100% } }
.subnav { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none }
.subnav::-webkit-scrollbar { display: none }
.subnav a { padding: 11px 16px 10px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s, border-color .2s }
.subnav a:first-child { padding-left: 0 }
.subnav a:hover { color: var(--fg-2) } .subnav a.on { color: var(--fg); border-bottom-color: var(--accent) }

/* primary instrument */
.prim { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px }
.sop { border-left: 1px solid var(--line); padding-left: 20px; display: flex; flex-direction: column }
.sop .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 9px 0; border-bottom: 1px solid var(--line) }
.sop .row span { color: var(--fg-2); font-size: 12.5px }
.sop .row b { font: 500 13px var(--mono); white-space: nowrap }
.sop .read { margin: 14px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--fg) }
@media (max-width: 1050px) { .prim { grid-template-columns: minmax(0, 1fr) } .sop { border-left: 0; border-top: 1px solid var(--line); padding: 6px 0 0 } }

/* status */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem }
.badge { display: inline-flex; align-items: center; gap: .5rem; padding: 0 .75rem; height: 32px; font: 500 12px var(--mono); letter-spacing: .12em; border: 1px solid }
.badge.ACCUMULATING { color: var(--up); border-color: var(--up) }
.badge.HOLDING { color: var(--fg-2); border-color: var(--line-2) }
.badge.SELLING { color: var(--warn); border-color: var(--warn) }
.badge.DISTRIBUTING { color: var(--crit); border-color: var(--crit) }
.trip { font-size: 12.5px; padding: .35rem .65rem; border: 1px dashed var(--line-2); color: var(--fg-2) }
.trip.armed { border-style: solid; border-color: var(--crit); color: var(--crit) }

/* evidence */
.ev { display: inline-flex; align-items: center; font: 500 9.5px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 0 .4rem; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; margin-right: .3rem }
.ev.inf { border-style: dashed; color: var(--muted) }
.wsearch { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px }
.wq { display: flex; gap: 8px } .wq input.q { flex: 1; width: auto; height: 42px; font: 500 13px var(--mono) } .wq .mini { height: 42px; padding: 0 .9rem }
.wq input.q:focus { outline: 1px solid var(--accent); outline-offset: -1px }
.wrecent { display: flex; flex-wrap: wrap; gap: .4rem .9rem; align-items: baseline } .wrecent .eyebrow { color: var(--accent) }
.whead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center } .wa { font-size: 13px; margin-right: 6px; word-break: break-all }
.wtags { display: flex; flex-wrap: wrap; gap: 6px 0; align-items: center } .wtags .ev.up { color: var(--up); border-color: var(--up) } .wtags .ev.mv-move { color: var(--warn); border-color: var(--warn) }
.wtags button.ev { cursor: pointer; background: none } .wlinks td { white-space: normal; vertical-align: top } .wlinks .addr, .wlinks .tag { margin-right: .3rem }
.wchk { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--fg-2); cursor: pointer } .wchk input { accent-color: var(--accent); width: 16px; height: 16px }
.wex { color: var(--accent); font-style: normal; font-size: 9px }
.wbel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center } .wbel .eyebrow { margin-right: 4px } .wbel .mini { height: 30px; font-size: 10.5px } .wbel .mini .hd { letter-spacing: .04em }
button.tag { background: none; cursor: pointer } button.tag:hover, .wtags button.ev:hover, .wtags a.ev:hover { border-color: var(--accent); color: var(--fg) } .wtags a.ev { text-decoration: none }
@media (max-width: 760px) { .wq { flex-direction: column } .wq input.q { flex: none; width: 100% } .wq .mini { justify-content: center } .wkv { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.evleg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px }
.evleg > div { padding: 14px 18px; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 3px 12px; align-items: start }
.evleg > div + div { border-left: 1px solid var(--line) }

.evleg b { font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase }
.evleg p { margin: 0; font-size: 12.5px; color: var(--fg-2) }
.evleg .disc { grid-column: 1 / -1; display: block; border-top: 1px solid var(--line); border-left: 0 !important; padding: 10px 18px; font-size: 12.5px; color: var(--fg-2) }
@media (max-width: 760px) { .evleg { grid-template-columns: minmax(0, 1fr) } .evleg > div + div { border-left: 0; border-top: 1px solid var(--line) } }

/* tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch }
/* queryable tables: a sort on every header, a filter under it */
table.q th { padding: 0 }
.qsort { display: inline-flex; align-items: baseline; gap: 2px; width: 100%; background: none; border: 0; cursor: pointer; padding: 7px 8px; font: inherit; color: inherit; text-align: inherit; min-height: 30px }
th.n .qsort { justify-content: flex-end } .qsort:hover { color: var(--accent) } .qsort i { font-style: normal; color: var(--accent) }
tr.qf td { padding: 0 4px 5px }
tr.qf input { width: 100%; min-width: 54px; height: 24px; background: var(--glass-2); border: 1px solid var(--line); color: var(--fg); padding: 0 5px; font: 400 11px var(--mono) }
tr.qf input:focus { outline: 1px solid var(--accent); outline-offset: -1px } tr.qf input::placeholder { color: var(--muted); opacity: .7 }
tr.qf td.n input { text-align: right }
.qcount { margin: 5px 0 0; color: var(--muted) }
table { border-collapse: collapse; width: 100%; font-size: 12.5px }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle }

tr:last-child td { border-bottom: 0 }
tbody tr { transition: background .12s } tbody tr:hover { background: var(--row) }
.addr { font: 500 12px var(--mono); color: var(--fg); cursor: pointer; background: none; border: 0; padding: 0; border-bottom: 1px dotted var(--line-2); transition: color .12s }
.addr:hover { color: var(--accent); border-bottom-color: var(--accent) }
.tag { display: inline-block; font: 500 9.5px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 0 .4rem; border: 1px solid var(--line); color: var(--fg-2); margin-right: .25rem; white-space: nowrap }
.bar { position: relative; height: 4px; background: var(--grid); min-width: 70px }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent) }
.sev { font: 500 10px var(--mono); letter-spacing: .1em }
.sev.high { color: var(--crit) } .sev.medium { color: var(--warn) } .sev.info { color: var(--muted) }
.alist { list-style: none; margin: 0; padding: 0 }
.alist li { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: .7rem; padding: .55rem 0; border-bottom: 1px solid var(--line); font-size: 12.5px }
.alist li:last-child { border-bottom: 0 }
.chips { display: flex; flex-wrap: wrap; gap: .35rem .7rem; padding: .4rem 0 .2rem; white-space: normal }
.st-acc { color: var(--up) } .st-sell { color: var(--down) } .st-move { color: var(--warn) } .st-int, .st-flat, .st-dorm { color: var(--muted) }
tr.r-acc td:first-child { box-shadow: inset 2px 0 var(--up) } tr.r-sell td:first-child { box-shadow: inset 2px 0 var(--down) } tr.r-move td:first-child { box-shadow: inset 2px 0 var(--warn) }
.how { white-space: normal; min-width: 14rem }
.how span { display: inline-block; margin: 0 .55rem .1rem 0; font: 400 11px var(--mono) }
.sumline { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; font: 400 12px var(--mono) }
.ownlink { background: none; border: 0; padding: 0; color: var(--fg-2); cursor: pointer; font: inherit; border-bottom: 1px dotted var(--line-2) }
.ownlink:hover { color: var(--accent) }
.hd { font-family: var(--mono); color: var(--accent); text-transform: none; letter-spacing: .02em; font-weight: 500 }
.tag.hd, .ev.hd { border-color: var(--accent) }
.ev.nm { text-transform: none; letter-spacing: .02em }

/* crowd */
dl.rd { margin: 8px 0 0; display: grid; gap: 0 }
dl.rd div { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1rem; padding: 9px 0; border-bottom: 1px solid var(--line) }
dl.rd div:last-child { border-bottom: 0 }
dl.rd dt { font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 3px }
dl.rd dd { margin: 0; font-size: 14px; line-height: 1.55 } dl.rd dd b { font-family: var(--mono); font-weight: 500 }
@media (max-width: 760px) { dl.rd div { grid-template-columns: minmax(0, 1fr); gap: 2px } }

/* entity cards */

@media (max-width: 760px) { .ecgrid { grid-template-columns: minmax(0, 1fr) } }
.ec { border: 1px solid var(--line); background: var(--glass-2); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 9px; box-shadow: inset 0 2px 0 var(--st); min-width: 0 }
.ec header { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem }
.ec h4 { margin: 0 0 4px; font: 600 13.5px var(--sans) }
.ecst { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap }
.ecv { display: flex; align-items: baseline; flex-wrap: wrap; gap: .3rem .7rem }
.ecv b { font: 500 19px var(--mono); letter-spacing: -.02em } .ecv span { font: 400 11.5px var(--mono); color: var(--muted) } .ecv small { font-size: 10.5px; color: var(--muted) }
.ecsp { width: 100%; height: 56px; display: block }
.ecspw { position: relative; cursor: crosshair; touch-action: pan-y }

.ecspw .ecdot { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--th); opacity: 0; pointer-events: none }
.ecspw.on .ecx, .ecspw.on .ecdot { opacity: 1 }
.ecax { display: flex; justify-content: space-between; font: 400 9.5px var(--mono); color: var(--muted); margin-top: 3px } .ecax span:nth-child(2) { opacity: .75 }
.ecwins { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line) }
.ecwins button { all: unset; cursor: pointer; padding: 5px 6px; display: flex; flex-direction: column; gap: 1px; box-shadow: 1px 0 0 var(--line) }
.ecwins button span { font: 500 9px var(--mono); letter-spacing: .12em; color: var(--muted) } .ecwins button b { font: 500 11.5px var(--mono) }
.ecwins button.on { background: var(--accent-2); box-shadow: inset 0 -2px 0 var(--accent) } .ecwins button:focus-visible { outline: 1px solid var(--accent) }
.ecwho { display: flex; flex-direction: column; gap: 3px } .ecwho .eyebrow { margin: 0 0 1px }
.ecwho div { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; font: 400 11px var(--mono) } .ecwho div b { font: 500 11.5px var(--mono) } .ecwho small { color: var(--muted); font-size: 10.5px }
.pfhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 10px }
.pfnw { display: block; font: 500 30px var(--mono); letter-spacing: -.03em; margin: 2px 0 } .pfchg { font: 500 12px var(--mono) }
.pfside { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font: 400 11.5px var(--mono); color: var(--fg-2) } .pfside b { color: var(--accent) }
.pfalloc { display: flex; height: 8px; background: var(--grid); margin: 4px 0 6px } .pfalloc i { display: block; height: 100% }
.pfkey { display: flex; flex-wrap: wrap; gap: .25rem .9rem; font: 400 11px var(--mono); color: var(--fg-2); margin-bottom: 10px } .pfkey i { display: inline-block; width: 8px; height: 8px; margin-right: .35rem }
.pft td { vertical-align: middle } .pft .pfa { display: flex; align-items: center; gap: .6rem; color: var(--fg); text-decoration: none } .pft .pfa span { display: flex; flex-direction: column; min-width: 0 }
.pft .pfa b { font: 600 12.5px var(--sans) } .pft .pfa small { font: 400 10.5px var(--sans); color: var(--muted); max-width: 18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pft tr.pfg td { background: var(--accent-2) } .pft td.n small { display: block; font-size: 10.5px }
.pfi { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--glass-2); font: 600 11px var(--mono); font-style: normal; color: var(--fg-2) }
.pfi.gme { border-color: var(--accent); color: var(--accent) } .pfi.eth { color: var(--fg) }
.pfbar { display: inline-block; vertical-align: middle; width: 42px; height: 4px; background: var(--grid); margin-right: 6px } .pfbar i { display: block; height: 100%; background: var(--accent) }
.pfrest { margin-top: 10px } .pfrest summary { list-style: none; cursor: pointer; width: fit-content } .pfrest summary::-webkit-details-marker { display: none } .pfrest .tw { margin-top: 8px; opacity: .8 }
.pfmini { display: flex; align-items: baseline; gap: .6rem; margin: 2px 0 4px } .pfmini b { font: 500 18px var(--mono) }
@media (max-width: 760px) { .pft .pfp { display: none } .pfside { align-items: flex-start } .pft .pfa small { max-width: 9rem } }
.netgrid { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 18px; align-items: start }
.netgrid .ec { box-shadow: inset 0 2px 0 var(--accent) } .netside { display: flex; flex-direction: column; gap: 8px; min-width: 0 } .netside .eyebrow { margin: 6px 0 0 }
.netev { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column } .netev li { padding: 8px 0; border-bottom: 1px solid var(--line); font: 400 12px var(--sans); display: flex; flex-direction: column; gap: 3px }
.netev li > div:first-child b { font-weight: 600 } .netev details summary { list-style: none; cursor: pointer; width: fit-content; margin-top: 2px } .netev details summary::-webkit-details-marker { display: none } .netev details .tw { margin-top: 6px }
.netline { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; margin: 10px 0 2px; padding: 8px 10px; border: 1px solid var(--line); border-left: 2px solid var(--accent); font: 400 12px var(--sans) } .netline b { font: 500 12px var(--mono) } .netline .mini { margin-left: auto }
.netev-tag { color: var(--accent); border-color: var(--accent); cursor: pointer; background: none }
@media (max-width: 900px) { .netgrid { grid-template-columns: minmax(0, 1fr) } }
.nmind { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 12px; margin-top: 4px }

.nmw { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 1px 0 0 var(--line) } .nmw > span { font: 500 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.nmw > b { font: 500 22px var(--mono); letter-spacing: -.02em } .nmw small { font: 400 11px var(--mono) } .nmw small i { font-style: normal } .nmw.isup { box-shadow: 1px 0 0 var(--line), inset 0 3px 0 var(--up) } .nmw.isdown { box-shadow: 1px 0 0 var(--line), inset 0 3px 0 var(--down) }

.nmrow { display: grid; grid-template-columns: minmax(0, 2.4fr) 1fr repeat(3, 1fr) 1.3fr; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line) } .nmrow:last-child { border-bottom: 0 }
.nml { display: flex; align-items: center; gap: .6rem; min-width: 0 } .nml span { display: flex; flex-direction: column; min-width: 0 } .nml b { font: 600 13px var(--sans) } .nml small { font: 400 10.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.nmdot { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 1.6px solid var(--accent); box-shadow: 0 0 0 2px var(--th), 0 0 0 3.5px var(--accent) } .nmdot.o { border-color: var(--fg-2); box-shadow: none }
.nmh { font: 500 15px var(--mono) } .nmc { display: flex; flex-direction: column } .nmc small { font: 500 9px var(--mono); letter-spacing: .12em; color: var(--muted) } .nmc b { font: 500 12.5px var(--mono) }
.nms { font: 500 12.5px var(--mono); text-align: right; display: flex; flex-direction: column } .nms small { font: 400 9.5px var(--mono); color: var(--muted) }
.nmread { margin: 10px 0 0; font: 500 13px var(--sans); color: var(--fg) }
.nmcells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); margin: 8px 0 } .nmcells span { padding: 6px 8px; display: flex; flex-direction: column; box-shadow: 1px 0 0 var(--line) } .nmcells small { font: 500 9px var(--mono); letter-spacing: .12em; color: var(--muted) } .nmcells b { font: 500 12.5px var(--mono) }
.nmkeyw { display: flex; align-items: center; gap: 12px } .nmkeyw.row { flex-wrap: wrap } .nmkeyt { display: flex; flex-direction: column; gap: 4px; font: 400 11.5px var(--sans); color: var(--fg-2) } .nmrl b { color: var(--fg); font-weight: 600 }
.nmkeyc { display: flex; flex-wrap: wrap; gap: 3px 12px } .nmkeyc span { display: inline-flex; align-items: center; gap: .35rem } .nmkeyc i { width: 12px; height: 4px; display: inline-block } .nmkeyc i.o { height: 10px; width: 10px; border-radius: 50%; border: 1.4px dashed var(--muted) } .nmkeyc i.gold { height: 10px; width: 10px; border-radius: 50%; border: 1.4px dashed var(--accent) }
.nmweb { display: flex; height: 34px; border: 1px solid var(--line); margin: 6px 0 8px; overflow: hidden } .nmweb i { display: flex; align-items: center; gap: .4rem; padding: 0 10px; font: 400 11.5px var(--sans); font-style: normal; white-space: nowrap; overflow: hidden; min-width: 0 } .nmweb b { font: 600 13px var(--mono) }
.nmweb i.a { background: var(--accent-2); box-shadow: inset 0 -2px 0 var(--accent) } .nmweb i.b { background: var(--glass-2); box-shadow: inset 0 -2px 0 var(--fg-2) } .nmweb i.c { color: var(--muted) }
.nmev summary { list-style: none; cursor: pointer; width: fit-content } .nmev summary::-webkit-details-marker { display: none }
@media (max-width: 900px) { .nmind { grid-template-columns: minmax(0, 1fr) } .nmrow { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 6px } .nmrow .nml { grid-column: span 3 } .nmrow .nmh { text-align: right } .nmrow .nms { text-align: right } .nmweb { flex-direction: column; height: auto } .nmweb i { padding: 6px 10px; flex: none !important } }
@media (max-width: 760px) { .nmleg { display: none } }
@media (max-width: 520px) { .nmwins { grid-template-columns: minmax(0, 1fr) } .nmw { box-shadow: 0 1px 0 var(--line) } .nmw > b { font-size: 19px } }

  const p0 = (P.weth * P.ethUsd) / P.gme, mc0 = p0 * SUPPLY, ethNeed = (r) => P.weth * (Math.sqrt(r) - 1);
  const bands = Ur.buckets.filter((b) => b.pct > 0 && b.hi > p0).map((b) => ({ lo: Math.max(b.lo, p0), hi: b.hi, pct: b.pct, gme: (b.pct / 100) * (held || 0) }));
  const R0 = 1.02, RMAX = Math.min(100, Math.max(10, Math.ceil(d3.max(bands, (b) => b.hi / p0) || 30)));
  const over = (r) => {                                            // overhang crossed up to r × today's price
    let gme = 0, usd = 0; const top = p0 * r;
    for (const b of bands) {
      if (b.lo >= top) continue;
      const hi = Math.min(b.hi, top), f = Math.log(hi / b.lo) / Math.log(b.hi / b.lo);
      if (f > 0) { gme += f * b.gme; usd += f * b.gme * Math.sqrt(b.lo * hi); }
    }
    return { gme, usd };
  };
  const need = (r, s) => ethNeed(r) * P.ethUsd + (s / 100) * over(r).usd;
  const clampR = (r) => Math.min(RMAX, Math.max(R0, r));
  const toSlider = (r) => Math.round((1000 * Math.log(r / R0)) / Math.log(RMAX / R0)), fromSlider = (v) => R0 * (RMAX / R0) ** (v / 1000);
  const parseTarget = (s) => {                                     // "$10M", "10m", "10,000,000", "4x"
    s = String(s).trim().toLowerCase().replace(/[$,\s]/g, "");
    let m = /^(\d*\.?\d+)(x|×)$/.exec(s); if (m) return +m[1];
    m = /^(\d*\.?\d+)([kmb])?$/.exec(s); if (!m) return null;
    return (+m[1] * ({ k: 1e3, m: 1e6, b: 1e9 }[m[2]] || 1)) / mc0;
  };
  const xTxt = (r) => (r < 10 ? +r.toFixed(r < 2 ? 2 : 1) : Math.round(r)) + "×";
  const bandTxt = (b) => `${fP(b.lo)}–${fP(b.hi)}: ${fPct(b.pct, 1)} of held supply (${fB(b.gme)} GME)`;
  const PRE = [2, 3, 5, 10, 25].filter((v) => v <= RMAX), SPRE = [0, 10, 25, 50, 100];
  let ui = null;                                                   // handles into the drawn chart, for live updates

  const summary = (r, s) => {
    const base = ethNeed(r) * P.ethUsd, o = over(r), extra = (s / 100) * o.usd;
    const crossed = bands.filter((b) => b.lo < p0 * r), wall = crossed.length ? crossed.reduce((a, b) => (b.pct > a.pct ? b : a)) : null;
    const next = bands.find((b) => b.lo >= p0 * r * 0.999 && b.pct >= 2);
    return `<div><dt>Today</dt><dd>Market cap ${fP(p0)} · ${P.weth.toFixed(1)} ETH against ${fB(P.gme)} GME.</dd></div>
      <div><dt>Target</dt><dd>Market cap <b>${fP(p0 * r)}</b> (${xTxt(r)}).</dd></div>
      <div><dt>No sellers</dt><dd>${ethNeed(r).toFixed(1)} ETH ≈ <b>${fU(base)}</b> of net buying.</dd></div>
      <div><dt>Overhang crossed</dt><dd>${held ? `${fB(o.gme)} GME (${fPct((100 * o.gme) / held, 1)} of held supply), bought for ${fU(o.usd)}, gets back to break-even on the way.` : "Held supply unavailable in this build."}</dd></div>
      <div><dt>With ${s}% selling</dt><dd>about <b>${fU(base + extra)}</b> of net buying (${fU(extra)} extra to absorb them).</dd></div>
      ${held && wall ? `<div><dt>Largest wall crossed</dt><dd>${bandTxt(wall)}.</dd></div>` : ""}
      ${held ? `<div><dt>Next wall above</dt><dd>${next ? `${bandTxt(next)}, ${xTxt(next.lo / p0)} today's market cap.` : "No band of 2% or more above the target in the data."}</dd></div>` : ""}`;
  };

  const update = (r, s, from) => {
    calcMult = clampR(r); calcSell = Math.max(0, Math.min(100, Math.round(s)));
    const el = $("calc"); if (!el) return;
    const inp = $("cmi"); if (inp && from !== "input") inp.value = fP(p0 * calcMult);
    if (from !== "slider") { const sl = $("cmr"); if (sl) sl.value = toSlider(calcMult); }
    const ss = $("csr"); if (ss && from !== "sell") ss.value = calcSell;
    $("csv").textContent = calcSell + "%";
    el.querySelectorAll("[data-cm]").forEach((b) => b.classList.toggle("on", Math.abs(+b.dataset.cm - calcMult) < 1e-6));
    el.querySelectorAll("[data-cs]").forEach((b) => b.classList.toggle("on", +b.dataset.cs === calcSell));
    $("calcsum").innerHTML = summary(calcMult, calcSell);
    if (ui) ui.place(calcMult, calcSell);
  };

  const draw = () => {
    const el = $("calc"); if (!el) return;
    el.innerHTML = `<div class="calcctl">
        <div class="cg"><label class="eyebrow" for="cmi">Target market cap</label>
          <div class="cgr"><input id="cmi" class="q" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" aria-describedby="cmi-h">${segBtns(PRE.map((v) => [v + "×", v]), calcMult, "cm")}</div>
          <input id="cmr" type="range" min="0" max="1000" step="1" aria-label="Target market cap">
          <p class="sub" id="cmi-h">Type a market cap ($10M) or a multiple (4×), slide, or click and drag on the chart.</p></div>
        <div class="cg"><label class="eyebrow" for="csr">Overhang that sells at break-even · <b id="csv"></b></label>
          <div class="cgr">${segBtns(SPRE.map((v) => [v + "%", v]), calcSell, "cs")}</div>
          <input id="csr" type="range" min="0" max="100" step="1" aria-label="Share of the overhang that sells at break-even"></div>
      </div>
      <dl class="rd" id="calcsum" style="margin-top:12px"></dl>`;
    const inp = $("cmi"), commit = () => { const v = parseTarget(inp.value); if (v && isFinite(v)) update(v, calcSell, "input"); inp.value = fP(p0 * calcMult); };
    inp.onchange = commit; inp.onkeydown = (ev) => { if (ev.key === "Enter") { commit(); inp.blur(); } };
    $("cmr").oninput = (ev) => update(fromSlider(+ev.target.value), calcSell, "slider");
    $("csr").oninput = (ev) => update(calcMult, +ev.target.value, "sell");
    el.onclick = (ev) => { const t = ev.target.closest("[data-cm],[data-cs]"); if (!t) return; if (t.dataset.cm) update(+t.dataset.cm, calcSell); else update(calcMult, +t.dataset.cs); };

    // ---- chart: net buying needed (top) and where the overhang was bought (bottom), one market-cap axis ----
    const ce = $("calcch"); ce.innerHTML = ""; ui = null;
    const mob = mobile(), H1 = mob ? 170 : 220, H2 = mob ? 84 : 104, gap = 26, m = { t: 22, r: 14, b: 26, l: 58 }, W = ce.clientWidth;
    const w = W - m.l - m.r, H = m.t + H1 + gap + H2 + m.b;
    const svg = d3.select(ce).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("height", H).style("touch-action", "pan-y").style("cursor", "crosshair");
    const g = svg.append("g").attr("transform", `translate(${m.l},${m.t})`), g2 = svg.append("g").attr("transform", `translate(${m.l},${m.t + H1 + gap})`);
    const x = d3.scaleLog([p0 * R0, p0 * RMAX], [0, w]);
    const rs = d3.range(0, 161).map((i) => R0 * (RMAX / R0) ** (i / 160));
    const REF = [0, 25, 50, 100], top = need(RMAX, 100) * 1.15, bot = need(R0, 0) * 0.85;
    const y = d3.scaleLog([bot, top], [H1, 0]).clamp(true);
    const xt = mcTicks(x, (k) => k === 1 || k === 2 || k === 5);
    // round-number ticks only: powers of ten, with 3× steps added when the range is short
    const e0 = Math.ceil(Math.log10(bot)), e1 = Math.floor(Math.log10(top));
    let yt = d3.range(e0, e1 + 1).map((e) => 10 ** e);
    if (yt.length < 4) yt = d3.range(e0 - 1, e1 + 1).flatMap((e) => [10 ** e, 3 * 10 ** e]).filter((v) => v >= bot && v <= top);
    g.append("g").attr("class", "gridl").call(d3.axisLeft(y).tickValues(yt).tickSize(-w).tickFormat(""));
    g.append("g").attr("class", "axis").call(d3.axisLeft(y).tickValues(yt).tickFormat((v) => fU(v)));
    g2.append("g").attr("class", "axis").attr("transform", `translate(0,${H2})`).call(d3.axisBottom(x).tickValues(xt).tickFormat(tickP));
    g.append("text").attr("class", "plabel").attr("x", -m.l + 2).attr("y", -9).text("Net buying needed to reach that market cap");
    g2.append("text").attr("class", "plabel").attr("x", -m.l + 2).attr("y", -8).text("Held supply bought at each market cap (break-even walls)");
    const line = (s) => d3.line().x((r) => x(p0 * r)).y((r) => y(need(r, s)))(rs);
    const cRef = C("--fg-2"), cMain = C("--accent"), cBar = C("--line-2"), cOn = C("--accent");
    REF.forEach((s) => g.append("path").attr("fill", "none").attr("stroke", cRef).attr("stroke-opacity", 0.35).attr("stroke-width", 1).attr("stroke-dasharray", s ? "3 3" : null).attr("d", line(s)));
    const main = g.append("path").attr("fill", "none").attr("stroke", cMain).attr("stroke-width", 2.4);
    // bars: one per band, share of held supply
    const by = d3.scaleLinear([0, d3.max(bands, (b) => b.pct) || 1], [H2, 0]);
    g2.append("g").attr("class", "axis").call(d3.axisLeft(by).ticks(3).tickFormat((v) => v + "%"));
    const bars = g2.selectAll("rect").data(bands.filter((b) => b.lo < p0 * RMAX)).join("rect")
      .attr("x", (b) => x(b.lo) + 0.5).attr("width", (b) => Math.max(1, x(Math.min(b.hi, p0 * RMAX)) - x(b.lo) - 1))

    const tl = svg.append("line").attr("stroke", cMain).attr("stroke-width", 1.5).attr("y1", m.t - 4).attr("y2", m.t + H1 + gap + H2);
    const dot = g.append("circle").attr("r", 4.5).attr("fill", cMain).attr("stroke", C("--bg")).attr("stroke-width", 1.5);
    const hl = g.append("line").attr("stroke", cMain).attr("stroke-opacity", 0.5).attr("stroke-dasharray", "2 3").attr("x1", 0);
    const lab = g.append("text").attr("class", "calc-lab").attr("fill", cMain).attr("paint-order", "stroke").attr("stroke", C("--bg")).attr("stroke-width", 4).attr("stroke-linejoin", "round");

      const t = `${fP(p0 * r)} · ${fU(need(r, s))}`; lab.text(t).attr("y", Math.max(11, Y - 11));
      const tw = lab.node().getComputedTextLength(), right = X + 8 + tw <= w;      // right of the line when it fits, else left
      lab.attr("x", right ? X + 8 : Math.max(tw, X - 8)).attr("text-anchor", right ? "start" : "end");
      bars.attr("fill", (b) => (b.lo < p0 * r ? cOn : cBar)).attr("fill-opacity", (b) => (b.lo < p0 * r ? 0.85 : 1));
    };
    ui = { place };
    place(calcMult, calcSell);
    // pointer: hover reads any market cap; press or drag sets the target
    const rAt = (ev) => { const [px] = d3.pointer(ev, g.node()); return clampR(x.invert(Math.max(0, Math.min(w, px))) / p0); };
    const tip = (ev, r) => {
      const o = over(r), b = bands.find((q) => q.lo <= p0 * r && p0 * r < q.hi);
      showTip(`<div class="h">Market cap ${fP(p0 * r)} · ${xTxt(r)}</div>` + trow(C("--fg-2"), "net buying, no sellers", fU(need(r, 0)))
        + trow(cMain, `with ${calcSell}% selling`, fU(need(r, calcSell)))
        + (held ? trow("", "overhang crossed", `${fB(o.gme)} (${fPct((100 * o.gme) / held, 1)})`) + trow("", "bought for", fU(o.usd)) : "")
        + (b && held ? `<p style="margin-top:.3rem">Band here: ${esc(bandTxt(b))}</p>` : "") + `<p style="margin-top:.3rem">${mob ? "Tap or drag to set the target" : "Click or drag to set the target"}</p>`, ev);
    };
    let dragging = false;
    svg.on("pointermove", (ev) => { const r = rAt(ev); xh.attr("x1", m.l + x(p0 * r)).attr("x2", m.l + x(p0 * r)).style("opacity", 1); if (dragging) update(r, calcSell, "drag"); tip(ev, r); })
      .on("pointerdown", (ev) => { dragging = true; svg.node().setPointerCapture?.(ev.pointerId); update(rAt(ev), calcSell, "drag"); tip(ev, rAt(ev)); })
      .on("pointerup pointercancel", () => { dragging = false; })
      .on("pointerleave", () => { if (!dragging) { xh.style("opacity", 0); hideTip(); } });
    $("calcch-l").innerHTML = `<span><i class="ln" style="background:${cMain}"></i>net buying needed, ${calcSell === 0 ? "no sellers" : "with your share selling"}</span>`
      + `<span><i class="ln" style="background:${cRef};opacity:.6"></i>0 / 25 / 50 / 100% of the overhang selling</span>`
      + `<span><i style="background:${cOn}"></i>bands crossed on the way</span><span><i style="background:${cBar}"></i>bands above the target</span>`;
    update(calcMult, calcSell);
  };
  draws.push(draw);
}

function unusualDays() {
  if (!has("tx")) return [];
  const tx = col("tx"), us = col("txUsd"), out = [];
  for (let i = 30; i < N; i++) {
    const mT = d3.median(tx.slice(i - 30, i).filter((v) => v != null)), mU = d3.median(us.slice(i - 30, i).filter((v) => v != null));
    const rT = mT && tx[i] != null ? tx[i] / mT : 0, rU = mU && us[i] != null ? us[i] / mU : 0;
    if (rT >= 3 || rU >= 3) out.push({ i, rT, rU, tx: tx[i], usd: us[i], label: [rT >= 3 ? rT.toFixed(1) + "× transfers" : "", rU >= 3 ? rU.toFixed(1) + "× value" : ""].filter(Boolean).join(" · ") });
  }

}

function moveKind(m) {

  if (m.tl === "Token contract") return ["To the token contract", "flat", "direct"];
  if (m.fl === "DEX") return ["Bought on DEX", "up", "direct"];
  if (m.tl === "DEX") return ["Sold on DEX", "down", "direct"];
  if (m.tl === "Exchange") return ["Deposit to exchange", "down", "direct"];
  if (m.fl === "Exchange") return ["Exchange withdrawal", "up", "direct"];

}

  nodes.forEach((n) => { if (n.fx != null && !n.pinned) { delete n.fx; delete n.fy; } });

  const panel = (n, e) => {

    const x = n.x0, st = stOf(x, n.bal), io = edges.filter((y) => y.s === n.id || y.t === n.id).sort((a, b) => b.w - a.w);

      ${n.kind !== "x" ? cgKv([["Holds", fBb(n.bal) + " GME"], ["% supply", fPct((100 * n.bal * 1e9) / SUPPLY, 3)], [wl + " change", x ? sgn(x.net, fBb) : "—", x ? cls(x.net) : ""], ["Status " + wl, `<span class="st-${st[0]}">${st[1]}</span>`]]) : ""}

  };
  CG = cgraph(el, { nodes, edges, H, sel: bubSel,
    tip: (n) => n.kind === "c" ? `<div class="h">${esc(n.label)}</div>` : `<div class="h">${esc(who(n))}</div>` + trow("", short(n.a), "") + (n.kind !== "x" ? trow("", "holds", fBb(n.bal)) + trow("", wl + " change", n.x0 ? sgn(n.x0.net, fBb) : "—") + trow("", "status", stOf(n.x0, n.bal)[1]) : "") + `<p style="margin-top:.3rem">Click for detail · ⌘/Ctrl-click opens Zerion · drag to move</p>`,
    tipE: (e) => `<div class="h">${esc(nl(e.source))} → ${esc(nl(e.target))}</div>` + trow(e.color, e.what, "") + trow("", "GME", fBb(e.g)) + trow("", "≈ $ today", fU(e.g * 1e9 * price)),

// ---------- METHODOLOGY ----------
function methodology() {
  pageHead("Methodology", "How the terminal is built", "What the data is, how each number is reconstructed, how wallets are tied together, and what none of it can tell you.", false);
  const tx = IDX ? fN(IDX.transfers) : "~470,000";
  add(`<article class="panel doc">
  <section><span class="dn">01 · Source</span><div><h2>Every transfer, from public nodes</h2>
    <p>The terminal reads every ERC-20 Transfer event of the GME contract <code>${TOKEN}</code> (9 decimals, 420.69B supply) since its first transfer at block 19,858,481 on 13 May 2024: ${tx} transfers to date. Logs come from public Ethereum RPC nodes (drpc and mevblocker) through <code>eth_getLogs</code>; both attach each block's timestamp, so no extra lookups are needed. No paid data source is used.</p>
    <p>The full history is stored as an archive and extended once a day. Each run re-pulls the last block it already had and replaces it, so a block can never be counted twice or missed at the seam.</p></div></section>
  <section><span class="dn">02 · Reconstruction</span><div><h2>Balances, cost and age, rebuilt from transfers</h2>
    <p>Replaying every transfer in block order gives each address's balance on every day. A cost engine then treats each wallet as a queue of lots (time, price, amount). A send uses up the oldest lots first, so every coin still held keeps its own buy price and age. From this come realized price, MVRV, supply in profit, SOPR, net realized profit and loss, the cost-basis distribution and the holding-age bands.</p>
    <ul><li>Pools, routers, contracts, labelled exchange wallets and the burn address are left out of holder counts and concentration. Only confirmed labels are used; no address is guessed.</li>
    <li>A DEX buy is GME leaving the Uniswap pools or a router to a wallet; a DEX sell is the reverse. A transfer to the token contract itself is not a sale.</li>
    <li>Contracts are told apart from wallets with <code>eth_getCode</code>. EIP-7702 accounts count as people.</li>
    <li>Uniswap V3 liquidity deposits are liquidity, not sales.</li></ul></div></section>
  <section><span class="dn">03 · Pricing</span><div><h2>Exact prices for trades, daily prices for the rest</h2>
    <p><b>DEX trades are priced at what was actually paid.</b> The same node query that returns the transfers also returns every Swap event of the two GME pools: the WETH that went in or out against the GME. Each wallet's buy or sale in that transaction gets that exact rate, converted to dollars at the day's ETH close. ${S.X ? `This covers ${fN(S.X.matched)} of ${fN(S.X.legs)} DEX trade legs (${fPct(S.X.coverageVol, 1)} of DEX volume). Priced at the day's GME close instead, a single trade was off by ${fPct(S.X.medianAbsErrPct, 1)} at the median and ${fPct(S.X.p90AbsErrPct, 0)} at the 90th percentile; across all of them the day's close put buys at ${fU(S.X.buy.closeUsd)} instead of ${fU(S.X.buy.exactUsd)} and sales at ${fU(S.X.sell.closeUsd)} instead of ${fU(S.X.sell.exactUsd)}.` : "Coverage figures appear after the next full run."} Exact prices feed the entity and owner cost basis, profit and loss, smart money and the DEX dollar flows. The cost engine behind realized price, MVRV and the cost-basis distribution still uses the day's close.</p>
    <p><b>Profit and loss over time.</b> Every group and every tracked wallet has a P&amp;L chart (the “P&amp;L chart →” button on a group card, and the wallet drawer). One method for both, oldest coins sold first (FIFO): a DEX buy costs what was actually paid; anything else that arrives (exchange withdrawal, transfer, liquidity removed) is costed at that day's close. A sale is GME going to the DEX or to an exchange (an exchange deposit is treated as a sale); it realizes the sale price minus the cost of the oldest coins held. Coins sent to other wallets, added to liquidity or burned leave at cost, with no profit or loss, because nothing was sold. Unrealized = holdings × the day's close − cost of the coins still held. For a group, moves between its own wallets are internal; for a single wallet, coins from its group's other wallets count as transfers. The price pane marks each day's trades: filled dots are DEX buys and sales at their average execution price, rings are exchange deposits and withdrawals at the day's close, sized by dollars.</p>
    <p><b>Prices are shown as market cap.</b> A GME price has too many zeros to read, so every price on this terminal (charts, costs, trades) is shown as the market cap it implies: price × 420.69B total supply. An average cost of $31.5M means the coins were bought, on average, when GME's market cap was $31.5M. The data underneath stays in price units, so this is only a change of scale.</p>
    <p>Everything else uses daily closes from DeFiLlama. DeFiLlama stamps each day with the previous day's close, so daily windows are shifted by one day. Transfers between wallets and exchange moves are valued at their day's price. Coins a wallet received by transfer rather than bought are costed at that day's market price. Market cap is price × 420.69B. Pool liquidity is read live from the Uniswap V2 pair's reserves.</p></div></section>
  <section><span class="dn">04 · Attribution</span><div><h2>When two wallets are treated as one owner</h2>
    <p>Wallets are grouped only when one of these rules holds. Each rule is graded by the kind of evidence behind it.</p>
    <div class="tw"><table><thead><tr><th>Rule</th><th>What links two wallets</th><th>Evidence</th></tr></thead><tbody>
      <tr><td>Seed</td><td>The first GME a wallet ever received (≥$2k) came from the other wallet.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Drain</td><td>A wallet sent ≥90% of its balance (≥$2k) to the other in one transfer.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>ETH funding</td><td>fbb4's main wallet (0xe147…fbb4) sent ≥0.1 ETH to the other wallet.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Gas link</td><td>One sent the other ≥0.001 ETH, and both are already on the watchlist.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>First ETH</td><td>One wallet sent the other its very first ETH (ETH side, since April 2024).</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Gas top-up</td><td>One sent the other ≤0.05 ETH and no GME came back (ETH side, since April 2024).</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Shared deposit address</td><td>Both used the same exchange deposit address. Only when 2 to 10 wallets share it and it forwards ≥95% to an exchange.</td><td><span class="ev inf">Inferred</span></td></tr>
    </tbody></table></div>
    <p><b>How a shared deposit address is found.</b> Exchanges give each account its own deposit address and sweep what arrives there into their hot wallets. The terminal does not get deposit addresses from the exchanges: it infers one from behaviour, an address that forwarded at least 95% of its GME to a labelled exchange wallet and received from 2 to 10 wallets. Two wallets that both paid into such an address funded the same exchange account. That points to one owner, but it is not proof: someone can deposit to a friend's account, settle an OTC trade or pay a seller that way, and an address that forwards to an exchange could also be a personal relay. Hence <i>inferred</i>. In fbb4's group, 58.2B of its 65.0B (snapshot of 5 Nov) connects to the main wallet through direct transfers only; the other 6.8B depends on a shared deposit address somewhere on the path. Each entity card shows this split.</p>
    <p><b>Following the coins.</b> Every run (every 4 hours) checks the last 90 days of transfers. A wallet joins an entity when a direct rule fires with one of its members: seed (a member gave it its first GME) or drain (one sent the other at least 90% of its balance), worth at least $2k, or a strong ETH link from the ETH side at any date (one sent the other its first ETH, or topped it up with ≤0.05 ETH). There is no hop limit, but nothing links through infrastructure, contracts, exchange deposit addresses or a sender that seeded more than 40 wallets. Linked groups stop at 60 wallets, and at most 25 wallets join one entity per run. Once a wallet joins, its moves with the group are internal: neither buying nor selling. A wallet that received at least $2k from an entity in 30 days without a rule firing is shown as <i>provisional</i>: visible, not counted.</p>
    <p><b>The ETH side.</b> Google's public Ethereum dataset (BigQuery) gives every top-level ETH transfer to or from the ${S.H ? fN(S.H.wallets) : "studied"} studied wallets since April 2024, and public nodes give the signer of every GME purchase into them. Two kinds of evidence are strong and direct: an <i>ETH seed</i> (one wallet sent the other its first ETH) and a <i>gas top-up</i> (≤0.05 ETH, no GME back). These group wallets like a GME seed or drain: the group builder links through them, and a wallet with such a link to a member of fbb4's group, the Coinbase group or a watched group joins it (marked “joined · first ETH” or “joined · gas top-up”). A larger ETH transfer is weak evidence: it could be a payment. A <i>paid purchase</i> (one wallet signed a swap that delivered GME from the pool straight to another) is weak too: checking them showed most signers are trading-bot executors that sign for many unrelated buyers (one buyer's purchases signed by up to 17 different executors, one executor signing for up to 15 buyers), so a signature alone does not show one owner. Two wallets whose first ETH came from the same private wallet (2 to 8 of them per funder) are an inferred link. ETH sent one way while GME went the other way between the same two wallets looks like a sale and is left out. Exchanges never link anyone: labelled hot wallets, any sender with more than 50,000 transactions, and any wallet that sent ETH to more than 12 studied wallets or received from more than 8. Weak and inferred links never group wallets; they are listed as leads on the ETH side page, next to the strong links between two existing groups (those are not merged: each group keeps the wallets it was built from).</p>
    <p>Guards: an address that seeds more than 40 wallets is a hub, so nothing links through it. A group larger than 60 wallets is flagged and never trusted. When such a web contains wallets of fbb4 or the Coinbase group (which are built by their own rules), those wallets are set aside and whatever stays linked among the rest becomes groups of its own; the few links that tie each of them to fbb4 are shown on its card but not merged, and the whole web still counts toward fbb4's “looser extension”, an upper bound. A shared exchange or relayer funder never links anyone. Tiny “address poisoning” transfers never link anyone. fbb4's base group stops two steps away from its main wallet (wallets joined later by following the coins have no step limit).</p>
    <p><b>Direct</b> describes the evidence, a transfer between the two wallets that anyone can check on-chain. It is not proof that one person controls both. <b>Inferred</b> means the link comes from a shared counterparty or a grouping rule, with no transfer between the two.</p>
    <div class="callout">Wallet links are evidence of shared control, not proof of ownership. Groups are a floor, not a ceiling: the rules err toward not merging.</div></div></section>
  <section><span class="dn">05 · Classifications</span><div><h2>How statuses are assigned</h2>
    <ul><li><b>Insider status</b> (fbb4's group, 30 days): DISTRIBUTING if it sent ≥0.05% of supply to exchanges; SELLING if it sold more than it bought on the DEX and shrank; ACCUMULATING if it grew by more than 0.05% of supply; otherwise HOLDING. The tripwire arms on any exchange deposit in 7 days, or a DEX sale by fbb4's main wallet in 30 days.</li>
    <li><b>Wallet monitor</b>: every wallet holding ≥0.1% of supply now or at any point in 90 days, plus its linked side wallets. A status needs a change of at least 0.5% of the wallet's balance. Selling means at least half of what left went to the DEX or an exchange. Moves between wallets of the same owner group are shown as own-wallet moves, not as buying or selling; in the owner view they cancel out.</li>
    <li><b>Entity status</b> (per window): accumulating if the group gained more than 1% of its holdings (and at least 0.01% of supply) from outside; when it lost that much, distributing if at least half went to exchanges, selling if at least half went to the DEX or exchanges, moving out otherwise; holding if it moved less; dormant if nothing moved. Internal moves never count.</li>
    <li><b>Entity tripwires</b> (since the last run): first exchange deposit or first DEX sale in 90 days, ≥0.05% of supply moved to wallets outside the group, a new provisional wallet holding ≥0.05% of supply, a group starting to form (first GME in the last 60 days, or +50% in 30 days, with ≥0.1% of supply), and wallets joined by following the coins. High and medium tripwires are also posted as a comment on the repository's “GME terminal alerts” issue.</li>
    <li><b>Entity cost basis</b>: first in, first out over the group's own inflows and outflows. Coins that arrived by transfer rather than a purchase are costed at that day's price.</li>
    <li><b>Quiet accumulators</b>: owners that added ≥0.1% of supply in 90 days and sold under 15% of it.</li>
    <li><b>Buy-and-hide</b>: fresh wallets fed by wallets that bought on the DEX and forwarded ≥80% of it. One counts as “still holding” only if it kept ≥80% of what it received and sold or deposited ≤20%.</li>
    <li><b>Unusual day</b>: transfers or value moved at least 3× the median of the previous 30 days. A display rule that points at days worth inspecting.</li></ul></div></section>
  <section><span class="dn">06 · Crowd</span><div><h2>Owners, not wallets</h2>
    <p>The Crowd page counts owners: an entity (all its wallets together) or a single wallet. Moves between one entity's wallets are never buying, selling or leaving. Only market flows count: GME arriving from the DEX or an exchange is a buy, GME going to them is a sale.</p>
    <ul><li><b>Buyer types:</b> new (the owner never held GME), returning (held before, but had 1M GME or less), adding (already holding).</li>
    <li><b>Seller types:</b> sold out (1M GME or less left) or kept a position; in profit or at a loss against the owner's average cost. Average cost = every inflow at that day's price; a transfer out to another owner lowers it in proportion; a sale realizes the difference.</li>
    <li><b>Arrival quarter:</b> the quarter the owner first received GME. Survival = owners still holding more than 1M GME ÷ owners that arrived.</li>
    <li><b>Smart money:</b> owners with at least $5k of realized profit and at least 100% on the coins they sold. Picked by today's record, so their history is a hindsight read.</li>
    <li><b>Valuation composite:</b> MVRV (25%), supply in profit (25%), price against its 140-day average (30%) and 30-day DEX net flow against pool depth (20%), each ranked against its own earlier values only, from 60 days of data on. 0 = lowest in its own past, 1 = highest.</li>
    <li><b>Pool and overhang calculator:</b> constant-product arithmetic on today's reserves. Multiplying the price by r takes ETH × (√r − 1) of net buying with no sellers. Overhang = held supply bought between today's price and the target, from the cost engine (a price band only partly crossed counts in proportion); if a share of it sells at break-even, the extra buying needed is roughly that share × its cost. The lower panel draws that supply band by band, so the walls a move would have to absorb are visible.</li></ul></div></section>
  <section><span class="dn">07 · Limits</span><div><h2>What the data cannot tell you</h2>
    <ul><li>Ethereum only. GME on other chains is not covered (MEXC's GME is the Solana token, not this one).</li>
    <li>What happens inside an exchange is invisible. A deposit is not proof of a sale, and only labelled exchange wallets are recognised; a deposit to an unlabelled address reads as a wallet-to-wallet transfer.</li>
    <li>Owner groups are a lower bound. A wallet funded only through an exchange or another chain cannot be linked from token transfers.</li>
    <li>A wallet that receives coins from a group but meets no linking rule stays outside the group (shown as provisional) until a rule fires. Until then, the group shows those coins as moved out, never as sold.</li>
    <li>Dollar values use daily prices. The market is thin, so small trades move the metrics. Every read describes a position, never a buy or sell signal. Nothing here is financial advice.</li></ul></div></section>
  <section><span class="dn">08 · Freshness</span><div><h2>Live index and research are separate</h2>
    <p>The index is rebuilt about every 4 hours by a scheduled job, and fully once a day (the first run after 06:00 UTC) including the external lookups of ETH funders and the Visualizer's graph. GitHub often starts scheduled jobs late or skips them, so the job checks twice an hour and works out from the last rebuild whether one is due: a missed check is made up by the next. The header shows when it last ran and turns to “Data stale” after 12 hours without a new run. The last day in every daily chart is partial: it runs up to the latest indexed transfer.</p>
    <p>The written study is a snapshot of ${STUDY_DATE}. The daily run does not update its findings. <a class="more" href="/study.html">Read the full study →</a></p></div></section>
  <section><span class="dn">09 · Wallet analysis</span><div><h2>Any address, its whole GME history</h2>
    <p>The <a href="#wallet">Wallet</a> page works for every address that ever sent or received GME (about 35,000). With every run the terminal writes one record per wallet: every transfer with its transaction, priced at the exact execution price when it is a DEX trade matched to a pool swap and at that day's close otherwise; profit and loss by the same FIFO method as the group charts (a DEX sale or an exchange deposit realizes, coins sent to other wallets leave at cost); and what the terminal already knows about it: its tracked or linked group, watch tags, where its first GME came from, which wallets it seeded with $2,000 or more (the grouping rules' bar), exchange deposit addresses it shares with other wallets, and strong ETH links.</p>
    <p>ETH funding comes from the BigQuery study for about 4,400 study wallets (top-level ETH transfers since April 2024; a first funder counts only if its ETH arrived before the wallet's own first transaction). For any other wallet the page asks Ethplorer's free API from your browser. It lists top-level transactions only, so ETH paid out by a contract or through an exchange's internal transaction does not show.</p>
    <p>“Bought the same way” compares buying fingerprints, not links: GME bought and number of DEX buys within 2.5× of the wallet's, the same main way of buying, and shares sold, sent on and received from other wallets within 15 points; ranked by how close they are, then by how near in time the buying started. Two wallets that behaved alike are not shown to be one owner.</p></div></section>
  <section><span class="dn">10 · Who's moving · tokens</span><div><h2>Recent activity by owner, and everything a wallet holds</h2>
    <p>The “Who's moving” board (Entities) and the Overview panel come from <code>movers.py</code>, run every time the terminal refreshes: every DEX buy and sale, exchange deposit and withdrawal and wallet-to-wallet transfer of the last 24 hours, 7 days and 30 days, grouped by owner (a tracked group, else a linked group, else the wallet), with GME moving between one owner's own wallets left out. Prices are the exact execution prices where the trade was matched to a pool swap, otherwise the day's close; transfers under $1 are ignored. A wallet that buys and sells in the same window shows both. Each entity card lists which of its wallets moved in the chosen window, and its 90-day line shows the holdings of today's wallets on each day.</p>
    <p>“Tokens it holds” (Wallet page, group drawers, Visualizer) is live, not part of the terminal's data: the viewer's browser asks Ethplorer's free API for the address's ETH and up to 100 token balances, priced by Ethplorer (CoinGecko-based). A token is counted only with a real market price (a market cap or daily trading volume, and at least 50 holders); airdropped spam and dead copies are listed apart and never added. A group's tokens are its wallets' tokens added up, the largest GME holders first. Tokens on other chains and DeFi positions are not included.</p></div></section>
  <section><span class="dn">11 · Networks</span><div><h2>Groups the rules keep apart, counted as one bloc after review</h2>
    <p>The grouping rules merge wallets only on the strongest evidence, so they never merge two groups on their own. A network is a short, owner-reviewed list (<code>data/networks.json</code>) of groups that a human reading of the evidence treats as one bloc; today the fbb4 network: fbb4, a8c8, dcf4, 019d and 5b69. The groups stay as they are underneath; the network is a view on top. Every run recomputes it as one owner: holdings, the 90-day line, flows over 1/7/30/90 days with every move between its groups internal, the status (the same rule as a group) and profit and loss (the same FIFO method). It counts as one owner on the “Who's moving” board.</p>
    <p>The evidence between its groups is recomputed from the chain every run: GME transfers between them (with the largest), ETH transfers (study data), shared wallets (a wallet that received GME from two or more of its groups other than its own, and where it sent the coins next) and shared exchange deposit addresses. A shared wallet is the hardest to explain away: two unrelated owners don't pay into the same private wallet. Whether a network is one person or a few people acting together, the chain cannot tell.</p></div></section>

  const ln = (k, c, wd, dash) => g3.append("path").datum(rows.filter((r) => r[k] != null)).attr("fill", "none").attr("stroke", C(c)).attr("stroke-width", wd).attr("stroke-dasharray", dash || null)

const plBox = (key) => `<div class="pl-box" data-plkey="${esc(key)}"><div class="ctl" style="margin-bottom:8px">${segBtns(PLR, plRange, "plr")}</div><div class="chart pl-chart"></div><div class="legend pl-legend"></div></div>`;
function wirePl(root, P) {
