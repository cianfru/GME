<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a12">
<title>GME on Ethereum · Terminal</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>try { const t = localStorage.getItem("gme-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root { --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --blur: blur(18px) saturate(1.45); --gut: max(16px, env(safe-area-inset-left, 0px)); --max: 1440px }
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #e7ecf4;
  --bg-grad: radial-gradient(1100px 680px at 6% -8%, rgb(230 186 90 / .34), transparent 62%), radial-gradient(1000px 720px at 104% 4%, rgb(96 140 235 / .30), transparent 60%),
    radial-gradient(900px 700px at 70% 112%, rgb(52 180 160 / .22), transparent 62%), linear-gradient(180deg, #eef2f8 0%, #e1e7f0 100%);
  --glass: rgb(255 255 255 / .58); --glass-2: rgb(255 255 255 / .55); --glass-hdr: rgb(246 248 252 / .72); --glass-pop: rgb(255 255 255 / .92); --th: rgb(248 250 253 / .97);
  --line: rgb(15 23 42 / .10); --line-2: rgb(15 23 42 / .22); --hi: rgb(255 255 255 / .95); --grid: rgb(15 23 42 / .07); --gridbg: rgb(15 23 42 / .04); --corner: rgb(15 23 42 / .5);
  --fg: #0b1220; --fg-2: #434d5e; --muted: #667085; --row: rgb(15 23 42 / .04);
  --accent: #9a6f0b; --accent-2: rgb(154 111 11 / .12);
  --up: #0a8a3a; --down: #c93636; --warn: #c0650f; --crit: #d03b3b; --neutral: #a3abb8;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --shadow: 0 30px 60px -40px rgb(15 23 42 / .35);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #060a12;
  --bg-grad: radial-gradient(1100px 680px at 6% -8%, rgb(214 168 72 / .20), transparent 62%), radial-gradient(1000px 720px at 104% 4%, rgb(58 108 206 / .28), transparent 60%),
    radial-gradient(900px 700px at 70% 112%, rgb(32 150 138 / .18), transparent 62%), linear-gradient(180deg, #060a12 0%, #0a1122 100%);
  --glass: rgb(16 24 40 / .52); --glass-2: rgb(255 255 255 / .035); --glass-hdr: rgb(7 11 20 / .66); --glass-pop: rgb(13 20 34 / .9); --th: rgb(13 20 34 / .97);
  --line: rgb(255 255 255 / .085); --line-2: rgb(255 255 255 / .17); --hi: rgb(255 255 255 / .07); --grid: rgb(255 255 255 / .055); --gridbg: rgb(255 255 255 / .03); --corner: rgb(255 255 255 / .45);
  --fg: #e8edf5; --fg-2: #a9b3c4; --muted: #75819a; --row: rgb(255 255 255 / .04);
  --accent: #d6b15a; --accent-2: rgb(214 177 90 / .13);
  --up: #48c287; --down: #f0706b; --warn: #ee9244; --crit: #f05f5c; --neutral: #5a667c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 30px 60px -36px rgb(0 0 0 / .8);
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; background: var(--bg) }
body { margin: 0; min-height: 100vh; color: var(--fg); font: 14px/1.5 var(--sans); overflow-x: hidden; -webkit-font-smoothing: antialiased; background: transparent }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: var(--bg-grad); pointer-events: none }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--gridbg) 1px, transparent 1px), linear-gradient(90deg, var(--gridbg) 1px, transparent 1px); background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 85%); mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 85%) }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2) }
button { font: inherit; color: inherit; border-radius: 0 }
input, select { border-radius: 0 }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px }
.mono, .num, td.n, .axis text { font-family: var(--mono); font-variant-numeric: tabular-nums }
.eyebrow { font: 500 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.up { color: var(--up) } .down { color: var(--down) } .flat { color: var(--muted) } .mv-move { color: var(--warn) }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gut) }

/* glass + sharp corners */
.panel { position: relative; min-width: 0; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hi), var(--shadow) }
.panel::after { content: ""; position: absolute; inset: -1px; pointer-events: none; --c: var(--corner); --s: 10px;
  background: linear-gradient(var(--c), var(--c)) top left / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) top left / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) top right / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) top right / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom left / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom right / 1px var(--s) no-repeat }
.panel.key::after { --c: var(--accent); --s: 14px }

/* header */
.hdr { position: sticky; top: 0; z-index: 30; background: var(--glass-hdr); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid var(--line) }
.hbar { display: flex; align-items: center; gap: 1.6rem; max-width: var(--max); margin: 0 auto; padding: 0 var(--gut); height: 56px }
.brand { display: flex; align-items: center; gap: .6rem; color: var(--fg); text-decoration: none; font: 600 12px var(--sans); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap }
.brand img { width: 24px; height: 24px; display: block }
.brand span { color: var(--muted); font-weight: 500 }
.nav { display: flex; gap: 1.7rem; flex: 1; min-width: 0; align-self: stretch }
.nav a { position: relative; display: flex; align-items: center; font: 500 11.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .15s }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .22s ease }
.nav a:hover { color: var(--fg-2) } .nav a.on { color: var(--fg) } .nav a.on::after { transform: scaleX(1) }
.hstat { display: inline-flex; align-items: center; gap: .45rem; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); white-space: nowrap; padding: 0 .65rem; height: 30px; border: 1px solid var(--line) }
.hstat i, .dstat i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-2); display: inline-block; flex: none }
.hstat.stale, .dstat.stale { color: var(--accent) } .hstat.stale { border-color: var(--accent) } .hstat.stale i, .dstat.stale i { background: var(--accent) }
.tbtn { background: none; border: 1px solid var(--line); height: 30px; padding: 0 .7rem; font: 500 10.5px var(--mono); letter-spacing: .12em; color: var(--muted); cursor: pointer }
.tbtn:hover { color: var(--fg) }
@media (max-width: 900px) {
  .hbar { flex-wrap: wrap; height: auto; padding-top: 10px; gap: 8px 10px }
  .brand { flex: 1 }
  .nav { order: 3; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; gap: 1.3rem; height: 42px; margin: 0 calc(-1 * var(--gut)); padding: 0 var(--gut) }
  .nav::-webkit-scrollbar { display: none }
  .hs-age, .brand span, .hs-pre { display: none }
  .prov .pd { display: none }
  .contract .full { display: none }
  .hero { gap: 12px }
  .hstat, .tbtn { height: 34px }
}

/* hero + metrics */
.hero { padding: 46px 0 22px; display: grid; gap: 16px }
.sline { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .8rem; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.sline .sep { opacity: .45 }
.dstat { display: inline-flex; align-items: center; gap: .45rem; color: var(--fg-2) }
.hero h1 { margin: 6px 0 0; font: 600 clamp(34px, 5.6vw, 64px)/.98 var(--sans); letter-spacing: .015em; text-transform: uppercase }
.hero h1 span { color: var(--muted); font-weight: 500 }
.lede { margin: 0; font: 400 clamp(15px, 1.5vw, 18px)/1.45 var(--sans); color: var(--fg-2); max-width: 48ch }
.contract { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; font-size: 12px }
.contract .mono { color: var(--fg-2); word-break: break-all }
.contract .shortc { display: none }
@media (max-width: 900px) { .contract .shortc { display: inline } }
.mini { background: none; border: 1px solid var(--line); padding: 0 .55rem; height: 26px; display: inline-flex; align-items: center; font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); cursor: pointer; text-decoration: none; white-space: nowrap }
.mini:hover { color: var(--fg); border-color: var(--line-2) }
.prov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px }
.prov > div { padding: 14px 18px; display: flex; flex-direction: column; gap: 5px }
.prov > div + div { border-left: 1px solid var(--line) }
.prov p { margin: 0; font-size: 13px; color: var(--fg-2) }
.more { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 1px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap }
.more:hover { color: var(--accent) }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden }
.mtoggle + .grid, .metrics + .mtoggle + .grid { margin-top: 14px }
.metrics .m { padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 3px; min-width: 0; box-shadow: 1px 1px 0 var(--line) }
.mk { font: 500 10px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); cursor: help; width: fit-content; border-bottom: 1px dotted var(--line-2) }
.mv { font: 500 22px/1.2 var(--mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.md { font: 400 11.5px/1.35 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mtoggle { display: none }
@media (max-width: 760px) {
  .hero { padding-top: 26px }
  .prov { grid-template-columns: minmax(0, 1fr) } .prov > div + div { border-left: 0; border-top: 1px solid var(--line) }
  .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)) } .metrics .m { padding: 13px 14px } .mv { font-size: 19px } .md { white-space: normal }
  .metrics.collapsed .m.sec { display: none }
  .mtoggle { display: flex; width: 100%; justify-content: center; margin-top: -1px }
}

/* page head, sections, grids */
.phead { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px 28px; padding: 38px 0 20px }
.phead h1 { margin: 8px 0 8px; font: 600 clamp(26px, 3.4vw, 40px)/1.05 var(--sans); letter-spacing: .005em }
.phead p { margin: 0; color: var(--fg-2); max-width: 70ch }
.sect { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1rem; margin: 36px 0 14px; padding-top: 14px; border-top: 1px solid var(--line) }
.sect h2 { margin: 0; font: 600 12.5px var(--sans); letter-spacing: .16em; text-transform: uppercase }
.sect p { margin: 0; color: var(--muted); font-size: 12.5px; flex-basis: 100% }
@media (min-width: 900px) { .sect p { flex-basis: auto } }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.grid + .grid { margin-top: 14px }
.wide { grid-column: 1 / -1 }
@media (max-width: 1100px) { .grid.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 860px) { .grid, .grid.c3 { grid-template-columns: minmax(0, 1fr) } }
main { padding-bottom: 60px }
#view.enter .panel, #view.enter .phead, #view.enter .hero > *, #view.enter .sect { animation: enter .28s ease-out }
@keyframes enter { from { opacity: 0; transform: translateY(6px) } }

/* cards */
.card { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem 1rem; flex-wrap: wrap }
.ph h3 { margin: 0; font: 500 10.5px/1.4 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--fg-2) }
.ph .q { margin: 5px 0 0; font: 500 16px/1.35 var(--sans); color: var(--fg) }
.pv { font: 500 17px/1.2 var(--mono); white-space: nowrap; letter-spacing: -.01em }
.pv small { font-size: 11.5px; margin-left: .45rem }
.sub { margin: 0; color: var(--fg-2); font-size: 13px; max-width: 86ch }
details.about { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px }
details.about summary { cursor: pointer; list-style: none; font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); width: fit-content }
details.about summary::-webkit-details-marker { display: none }
details.about summary::before { content: "+ " } details.about[open] summary::before { content: "− " }
details.about summary:hover { color: var(--fg-2) }
details.about p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; max-width: 90ch }
.chart { position: relative; width: 100%; min-height: 120px }
.chart svg { display: block; width: 100%; overflow: visible }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; font-size: 12px; color: var(--fg-2) }
.legend:empty { display: none }
.legend > .tw { min-width: 0; flex: 1 1 100% }
@media (max-width: 760px) { .pv { white-space: normal; max-width: 100% } }
.legend span { display: inline-flex; align-items: center; gap: .45rem }
.legend i { width: 9px; height: 9px; flex: none }
.legend i.ln { height: 2px; width: 14px }
.legend i.dash { height: 0; width: 16px; border-top: 2px dashed; background: none !important }
.axis text { font-size: 10px; fill: var(--muted) }
.axis line { stroke: var(--line) } .axis .domain { display: none }
.gridl line { stroke: var(--grid) } .gridl .domain { display: none }
.lbl { font: 500 10.5px var(--sans); fill: var(--fg-2) }
.plabel { font: 500 9.5px var(--mono); letter-spacing: .13em; text-transform: uppercase; fill: var(--muted) }
.xhair { stroke: var(--fg-2); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none }
.empty { border: 1px dashed var(--line-2); padding: 18px; display: flex; flex-direction: column; gap: 4px }
.empty p { margin: 0; color: var(--fg-2); font-size: 13px }

/* segmented controls */
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--glass-2); flex: none; max-width: 100%; overflow-x: auto; scrollbar-width: none }
.seg::-webkit-scrollbar { display: none } .seg button { white-space: nowrap; flex: none }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: 0 .75rem; height: 32px; font: 500 10.5px var(--mono); letter-spacing: .1em; color: var(--muted); cursor: pointer; transition: color .15s, background .15s }
.seg button:last-child { border-right: 0 } .seg button:hover { color: var(--fg-2) }
.seg button.on { color: var(--fg); background: var(--accent-2); box-shadow: inset 0 -1px 0 var(--accent) }
@media (max-width: 760px) { .seg button { height: 40px; padding: 0 .65rem } }
.ctl { display: flex; flex-wrap: wrap; gap: .55rem .8rem; align-items: center }
.chip { background: var(--glass-2); border: 1px solid var(--line); padding: 0 .75rem; height: 32px; font: 500 12px var(--sans); color: var(--fg-2); cursor: pointer; transition: border-color .15s, color .15s }
.chip.on { border-color: var(--accent); color: var(--fg) }
.chip b { font: 500 11.5px var(--mono); margin-left: .25rem }
@media (max-width: 760px) { .chip { height: 40px } }
input.q, select.q { background: var(--glass-2); border: 1px solid var(--line); color: var(--fg); padding: 0 .65rem; height: 32px; font: 400 12.5px var(--sans); min-width: 0 }
input.q { width: 15rem; max-width: 100% } select.q { max-width: 100% }
@media (max-width: 760px) { input.q, select.q { height: 40px; width: 100% } }
.subnav { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none }
.subnav::-webkit-scrollbar { display: none }
.subnav a { padding: 11px 16px 10px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s, border-color .2s }
.subnav a:first-child { padding-left: 0 }
.subnav a:hover { color: var(--fg-2) } .subnav a.on { color: var(--fg); border-bottom-color: var(--accent) }

/* primary instrument */
.prim { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px }
.sop { border-left: 1px solid var(--line); padding-left: 20px; display: flex; flex-direction: column }
.sop .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 9px 0; border-bottom: 1px solid var(--line) }
.sop .row span { color: var(--fg-2); font-size: 12.5px }
.sop .row b { font: 500 13px var(--mono); white-space: nowrap }
.sop .read { margin: 14px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--fg) }
@media (max-width: 1050px) { .prim { grid-template-columns: minmax(0, 1fr) } .sop { border-left: 0; border-top: 1px solid var(--line); padding: 6px 0 0 } }

/* status */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem }
.badge { display: inline-flex; align-items: center; gap: .5rem; padding: 0 .75rem; height: 32px; font: 500 12px var(--mono); letter-spacing: .12em; border: 1px solid }
.badge.ACCUMULATING { color: var(--up); border-color: var(--up) }
.badge.HOLDING { color: var(--fg-2); border-color: var(--line-2) }
.badge.SELLING { color: var(--warn); border-color: var(--warn) }
.badge.DISTRIBUTING { color: var(--crit); border-color: var(--crit) }
.trip { font-size: 12.5px; padding: .35rem .65rem; border: 1px dashed var(--line-2); color: var(--fg-2) }
.trip.armed { border-style: solid; border-color: var(--crit); color: var(--crit) }

/* evidence */
.ev { display: inline-flex; align-items: center; font: 500 9.5px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 0 .4rem; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; margin-right: .3rem }
.ev.inf { border-style: dashed; color: var(--muted) }
.evleg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px }
.evleg > div { padding: 14px 18px; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 3px 12px; align-items: start }
.evleg > div + div { border-left: 1px solid var(--line) }
.evleg svg { grid-row: span 2; margin-top: 6px }
.evleg b { font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase }
.evleg p { margin: 0; font-size: 12.5px; color: var(--fg-2) }
.evleg .disc { grid-column: 1 / -1; display: block; border-top: 1px solid var(--line); border-left: 0 !important; padding: 10px 18px; font-size: 12.5px; color: var(--fg-2) }
@media (max-width: 760px) { .evleg { grid-template-columns: minmax(0, 1fr) } .evleg > div + div { border-left: 0; border-top: 1px solid var(--line) } }

/* tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch }
/* queryable tables: a sort on every header, a filter under it */
table.q th { padding: 0 }
.qsort { display: inline-flex; align-items: baseline; gap: 2px; width: 100%; background: none; border: 0; cursor: pointer; padding: 7px 8px; font: inherit; color: inherit; text-align: inherit; min-height: 30px }
th.n .qsort { justify-content: flex-end } .qsort:hover { color: var(--accent) } .qsort i { font-style: normal; color: var(--accent) }
tr.qf td { padding: 0 4px 5px }
tr.qf input { width: 100%; min-width: 54px; height: 24px; background: var(--glass-2); border: 1px solid var(--line); color: var(--fg); padding: 0 5px; font: 400 11px var(--mono) }
tr.qf input:focus { outline: 1px solid var(--accent); outline-offset: -1px } tr.qf input::placeholder { color: var(--muted); opacity: .7 }
tr.qf td.n input { text-align: right }
.qcount { margin: 5px 0 0; color: var(--muted) }
table { border-collapse: collapse; width: 100%; font-size: 12.5px }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle }

#drawer { position: fixed; inset: 0 0 0 auto; width: min(780px, 100vw); background: var(--glass-pop); -webkit-backdrop-filter: blur(26px) saturate(1.4); backdrop-filter: blur(26px) saturate(1.4);

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
/* visualizer: full-bleed canvas with floating glass panels */
body.vzmode main.wrap { max-width: none; padding: 0 } body.vzmode .foot { display: none } .vz [hidden] { display: none !important }
.vz { position: relative; height: calc(100dvh - var(--hdrh, 57px)); overflow: hidden; border-top: 1px solid var(--line) }

.vzq input:focus { outline: 1px solid var(--accent); outline-offset: -1px } .vzq .mini { height: 30px } .vzq .mini.on { border-color: var(--accent); color: var(--accent) }

.vzsug button { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 9px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); text-align: left; cursor: pointer; font: 400 12px var(--sans) }
.vzsug button:last-child { border-bottom: 0 } .vzsug button:hover, .vzsug button.on { background: var(--accent-2) } .vzsug small { color: var(--muted); font: 400 11px var(--mono); white-space: nowrap }
.vzfil { display: flex; flex-direction: column; gap: 7px } .vzrow { display: flex; align-items: center; gap: 9px; flex-wrap: wrap } .vzrow > .eyebrow { width: 70px; flex: none } .vzrow .chips { padding: 0; gap: .35rem }
/* active filters: one accent. The dimension is a gold monospace key, the value plain — no per-filter hue. */
.vzchips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center }
.vzchip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--glass-2); padding: 3px 4px 3px 7px; font: 400 11.5px var(--sans); color: var(--fg) }
.vzchip i { font: 500 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-style: normal }

.vzchip button { background: none; border: 0; color: var(--muted); cursor: pointer; font: 400 13px/1 var(--sans); padding: 2px 4px; min-width: 20px; min-height: 20px } .vzchip button:hover { color: var(--down) }
.vzchips .clr { background: none; border: 0; color: var(--muted); cursor: pointer; font: 500 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 4px 2px } .vzchips .clr:hover { color: var(--accent) }
/* tools: exclusive click modes, then history, then view */
.vztools { position: absolute; z-index: 4; right: 400px; bottom: 12px; display: flex; gap: 7px; align-items: flex-end }
.vztools .grp { display: flex } .vztools .grp + .grp { position: relative }
.vztools button { width: 30px; height: 30px; background: var(--glass-pop); border: 1px solid var(--line-2); margin-left: -1px; cursor: pointer; font: 500 13px var(--mono); color: var(--fg-2); display: grid; place-items: center }
.vztools button:hover:not(:disabled) { color: var(--accent) } .vztools button:disabled { opacity: .35; cursor: default }
.vztools button.on { color: var(--accent); border-color: var(--accent); background: var(--accent-2); z-index: 1 }
.vztools svg { display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
.vzmode-hint { position: absolute; z-index: 4; bottom: 50px; right: 400px; font: 500 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); background: var(--glass-pop); border: 1px solid var(--line); padding: 4px 7px; pointer-events: none }
@media (pointer: coarse) { .vztools button { width: 38px; height: 38px } .vzchip button { min-width: 26px; min-height: 26px } }
.vzlegend { position: absolute; z-index: 3; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 5px 12px; max-width: calc(100% - 640px); font: 400 11px var(--sans); color: var(--fg-2); background: var(--glass-pop); border: 1px solid var(--line); padding: 6px 9px }
.vzlegend span { display: inline-flex; align-items: center; gap: 6px } .vzlegend .ln { width: 16px; height: 2px; display: inline-block } .vzlegend svg { display: block }
.vzside { position: absolute; z-index: 4; top: 12px; right: 12px; bottom: 12px; width: 376px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding: 11px }
.vzph { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px } .vzph h4 { margin: 3px 0 0; font: 500 13px/1.3 var(--sans); color: var(--fg); word-break: break-word }
.vzph .x { background: none; border: 1px solid var(--line); min-width: 28px; min-height: 28px; cursor: pointer; font-size: 15px; color: var(--fg-2) }
.vzaddr { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--fg-2) } .vzaddr .mono { width: 100%; word-break: break-all; font-size: 11px; color: var(--muted) }
.vzkv { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); margin: 0 } .vzkv div { padding: 6px 9px; box-shadow: 1px 1px 0 var(--line); min-width: 0 }
.vzkv dt { font: 500 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) } .vzkv dd { margin: 2px 0 0; font: 500 12px var(--mono); color: var(--fg) } .vzkv small { color: var(--muted); font-size: 10.5px }
.vzact { display: flex; flex-wrap: wrap; gap: 5px }
.vzlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); flex: none }
.vzside > .vzkv, .vzside > .vzact, .vzside > .eyebrow { flex: none }
.vzlist button { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 2px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); font: 400 12px var(--sans); text-align: left; cursor: pointer; min-height: 28px }
.vzlist button:hover { background: var(--row) } .vzlist button.off { color: var(--muted) } .vzlist button > b { font: 500 11.5px var(--mono); white-space: nowrap }
@media (pointer: coarse) { .vzlist button { min-height: 34px } .vzph .x { min-width: 36px; min-height: 36px } }
/* the ledger: the individual transfers behind an edge, with a filter and a sort on every column */
/* flex: none matters — the panel is a flex column, and `overflow` here sets min-height:0, so the table would
   otherwise shrink to nothing instead of scrolling inside itself. */
.vzled { border: 1px solid var(--line); overflow: auto; flex: none; max-height: 340px; overscroll-behavior: contain }
/* fixed layout so the block number always fits the panel: only the counterparty gives way */
.vzled table { border-collapse: collapse; width: 100%; table-layout: fixed; font: 400 10.5px var(--mono); font-variant-numeric: tabular-nums }
.vzled th { position: sticky; top: 0; background: var(--th); text-align: left; padding: 0; border-bottom: 1px solid var(--line-2); white-space: nowrap }
.vzled th .hd { display: flex; align-items: center; gap: 3px; padding: 5px 6px }
.vzled th button { background: none; border: 0; cursor: pointer; padding: 1px 2px; font: 500 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-height: 20px }
.vzled th button:hover { color: var(--accent) } .vzled th button.on { color: var(--accent) }
.vzled th .f { font-size: 10px; letter-spacing: 0; opacity: .8 } .vzled th .f.on { opacity: 1 }
.vzled td { padding: 4px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; color: var(--fg-2) }
.vzled td { overflow: hidden; text-overflow: ellipsis }
.vzled tr:hover td { background: var(--row) } .vzled td.v { color: var(--fg); font-weight: 500; text-align: right } .vzled td.d { text-align: right }
.vzled a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line-2) } .vzled a:hover { color: var(--accent) }
.vzled .no { padding: 10px 8px; color: var(--muted); font: 400 11px var(--sans) }
.vzledf { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: -2px }
.vzledf input { width: 74px; height: 24px; background: var(--glass-2); border: 1px solid var(--line); color: var(--fg); padding: 0 5px; font: 400 11px var(--mono) }
.vzledf input:focus { outline: 1px solid var(--accent); outline-offset: -1px }
.vzload { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--muted); font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; pointer-events: none }
@media (max-width: 760px) {
  .vzbar { width: calc(100% - 24px) } .vzrow > .eyebrow { width: 100% }
  .vzside { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 55%; display: none; border-left: 0; border-right: 0; border-bottom: 0 } .vzside.open { display: flex }
  .vztools { right: 12px; bottom: 12px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 24px) } .vzside.open ~ .vztools, .vz:has(.vzside.open) .vztools { display: none }
  .vzlegend, .vzmode-hint { display: none }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { :root[data-theme="dark"] { --glass: rgb(16 24 40 / .92) } :root[data-theme="light"] { --glass: rgb(255 255 255 / .9) } }

<script>
(() => {
"use strict";
const SUPPLY = 420.69e9, FNAME = "fbb4", FOCUS = "0xe14767042159e5bd2bf16f81a0fe387ab153fbb4", TOKEN = "0xc56C7A0eAA804f854B536A5F3D5f49D2EC4B12b8", STUDY_DATE = "30 Oct 2026";
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const ZONES = [[0.2, "Low vs its own history"], [0.4, "Below its middle"], [0.6, "Middle of its range"], [0.8, "Above its middle"], [1.01, "High vs its own history"]];

function composite() {          // expanding-window percentile ranks: each day only sees its own past (no look-ahead)

  const ma = p.map((_, i) => { const w = p.slice(Math.max(0, i - 139), i + 1).filter((x) => x); return w.length >= 60 ? p[i] / d3.mean(w) : null; });

    const rT = mT && tx[i] != null ? tx[i] / mT : 0, rU = mU && us[i] != null ? us[i] / mU : 0;

function moveKind(m) {

  if (m.tl === "Token contract") return ["To the token contract", "flat", "direct"];
  if (m.fl === "DEX") return ["Bought on DEX", "up", "direct"];
  if (m.tl === "DEX") return ["Sold on DEX", "down", "direct"];
  if (m.tl === "Exchange") return ["Deposit to exchange", "down", "direct"];
  if (m.fl === "Exchange") return ["Exchange withdrawal", "up", "direct"];
  if (m.fl === "Liquidity" || m.tl === "Liquidity") return ["Liquidity", "flat", "direct"];
  if (m.tl === "Burn") return ["Burn", "flat", "direct"];
  if (m.fg && m.fg === m.tg) return ["Within one group", "flat", "inferred"];

}

  function info(n) {

// ---------- METHODOLOGY ----------
function methodology() {
  pageHead("Methodology", "How the terminal is built", "What the data is, how each number is reconstructed, how wallets are tied together, and what none of it can tell you.", false);
  const tx = IDX ? fN(IDX.transfers) : "~470,000";
  add(`<article class="panel doc">
  <section><span class="dn">01 · Source</span><div><h2>Every transfer, from public nodes</h2>
    <p>The terminal reads every ERC-20 Transfer event of the GME contract <code>${TOKEN}</code> (9 decimals, 420.69B supply) since its first transfer at block 19,858,481 on 13 May 2024: ${tx} transfers to date. Logs come from public Ethereum RPC nodes (drpc and mevblocker) through <code>eth_getLogs</code>; both attach each block's timestamp, so no extra lookups are needed. No paid data source is used.</p>
    <p>The full history is stored as an archive and extended once a day. Each run re-pulls the last block it already had and replaces it, so a block can never be counted twice or missed at the seam.</p></div></section>
  <section><span class="dn">02 · Reconstruction</span><div><h2>Balances, cost and age, rebuilt from transfers</h2>
    <p>Replaying every transfer in block order gives each address's balance on every day. A cost engine then treats each wallet as a queue of lots (time, price, amount). A send uses up the oldest lots first, so every coin still held keeps its own buy price and age. From this come realized price, MVRV, supply in profit, SOPR, net realized profit and loss, the cost-basis distribution and the holding-age bands.</p>
    <ul><li>Pools, routers, contracts, labelled exchange wallets and the burn address are left out of holder counts and concentration. Only confirmed labels are used; no address is guessed.</li>
    <li>A DEX buy is GME leaving the Uniswap pools or a router to a wallet; a DEX sell is the reverse. A transfer to the token contract itself is not a sale.</li>
    <li>Contracts are told apart from wallets with <code>eth_getCode</code>. EIP-7702 accounts count as people.</li>
    <li>Uniswap V3 liquidity deposits are liquidity, not sales.</li></ul></div></section>
  <section><span class="dn">03 · Pricing</span><div><h2>Exact prices for trades, daily prices for the rest</h2>
    <p><b>DEX trades are priced at what was actually paid.</b> The same node query that returns the transfers also returns every Swap event of the two GME pools: the WETH that went in or out against the GME. Each wallet's buy or sale in that transaction gets that exact rate, converted to dollars at the day's ETH close. ${S.X ? `This covers ${fN(S.X.matched)} of ${fN(S.X.legs)} DEX trade legs (${fPct(S.X.coverageVol, 1)} of DEX volume). Priced at the day's GME close instead, a single trade was off by ${fPct(S.X.medianAbsErrPct, 1)} at the median and ${fPct(S.X.p90AbsErrPct, 0)} at the 90th percentile; across all of them the day's close put buys at ${fU(S.X.buy.closeUsd)} instead of ${fU(S.X.buy.exactUsd)} and sales at ${fU(S.X.sell.closeUsd)} instead of ${fU(S.X.sell.exactUsd)}.` : "Coverage figures appear after the next full run."} Exact prices feed the entity and owner cost basis, profit and loss, smart money and the DEX dollar flows. The cost engine behind realized price, MVRV and the cost-basis distribution still uses the day's close.</p>
    <p><b>Profit and loss over time.</b> Every group and every tracked wallet has a P&amp;L chart (the “P&amp;L chart →” button on a group card, and the wallet drawer). One method for both, oldest coins sold first (FIFO): a DEX buy costs what was actually paid; anything else that arrives (exchange withdrawal, transfer, liquidity removed) is costed at that day's close. A sale is GME going to the DEX or to an exchange (an exchange deposit is treated as a sale); it realizes the sale price minus the cost of the oldest coins held. Coins sent to other wallets, added to liquidity or burned leave at cost, with no profit or loss, because nothing was sold. Unrealized = holdings × the day's close − cost of the coins still held. For a group, moves between its own wallets are internal; for a single wallet, coins from its group's other wallets count as transfers. The price pane marks each day's trades: filled dots are DEX buys and sales at their average execution price, rings are exchange deposits and withdrawals at the day's close, sized by dollars.</p>
    <p><b>Prices are shown as market cap.</b> A GME price has too many zeros to read, so every price on this terminal (charts, costs, trades) is shown as the market cap it implies: price × 420.69B total supply. An average cost of $31.5M means the coins were bought, on average, when GME's market cap was $31.5M. The data underneath stays in price units, so this is only a change of scale.</p>
    <p>Everything else uses daily closes from DeFiLlama. DeFiLlama stamps each day with the previous day's close, so daily windows are shifted by one day. Transfers between wallets and exchange moves are valued at their day's price. Coins a wallet received by transfer rather than bought are costed at that day's market price. Market cap is price × 420.69B. Pool liquidity is read live from the Uniswap V2 pair's reserves.</p></div></section>
  <section><span class="dn">04 · Attribution</span><div><h2>When two wallets are treated as one owner</h2>
    <p>Wallets are grouped only when one of these rules holds. Each rule is graded by the kind of evidence behind it.</p>
    <div class="tw"><table><thead><tr><th>Rule</th><th>What links two wallets</th><th>Evidence</th></tr></thead><tbody>
      <tr><td>Seed</td><td>The first GME a wallet ever received (≥$2k) came from the other wallet.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Drain</td><td>A wallet sent ≥90% of its balance (≥$2k) to the other in one transfer.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>ETH funding</td><td>fbb4's main wallet (0xe147…fbb4) sent ≥0.1 ETH to the other wallet.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Gas link</td><td>One sent the other ≥0.001 ETH, and both are already on the watchlist.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>First ETH</td><td>One wallet sent the other its very first ETH (ETH side, since April 2024).</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Gas top-up</td><td>One sent the other ≤0.05 ETH and no GME came back (ETH side, since April 2024).</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Shared deposit address</td><td>Both used the same exchange deposit address. Only when 2 to 10 wallets share it and it forwards ≥95% to an exchange.</td><td><span class="ev inf">Inferred</span></td></tr>
    </tbody></table></div>
    <p><b>How a shared deposit address is found.</b> Exchanges give each account its own deposit address and sweep what arrives there into their hot wallets. The terminal does not get deposit addresses from the exchanges: it infers one from behaviour, an address that forwarded at least 95% of its GME to a labelled exchange wallet and received from 2 to 10 wallets. Two wallets that both paid into such an address funded the same exchange account. That points to one owner, but it is not proof: someone can deposit to a friend's account, settle an OTC trade or pay a seller that way, and an address that forwards to an exchange could also be a personal relay. Hence <i>inferred</i>. In fbb4's group, 58.2B of its 65.0B (snapshot of 5 Nov) connects to the main wallet through direct transfers only; the other 6.8B depends on a shared deposit address somewhere on the path. Each entity card shows this split.</p>
    <p><b>Following the coins.</b> Every run (every 4 hours) checks the last 90 days of transfers. A wallet joins an entity when a direct rule fires with one of its members: seed (a member gave it its first GME) or drain (one sent the other at least 90% of its balance), worth at least $2k, or a strong ETH link from the ETH side at any date (one sent the other its first ETH, or topped it up with ≤0.05 ETH). There is no hop limit, but nothing links through infrastructure, contracts, exchange deposit addresses or a sender that seeded more than 40 wallets. Linked groups stop at 60 wallets, and at most 25 wallets join one entity per run. Once a wallet joins, its moves with the group are internal: neither buying nor selling. A wallet that received at least $2k from an entity in 30 days without a rule firing is shown as <i>provisional</i>: visible, not counted.</p>
    <p><b>The ETH side.</b> Google's public Ethereum dataset (BigQuery) gives every top-level ETH transfer to or from the ${S.H ? fN(S.H.wallets) : "studied"} studied wallets since April 2024, and public nodes give the signer of every GME purchase into them. Two kinds of evidence are strong and direct: an <i>ETH seed</i> (one wallet sent the other its first ETH) and a <i>gas top-up</i> (≤0.05 ETH, no GME back). These group wallets like a GME seed or drain: the group builder links through them, and a wallet with such a link to a member of fbb4's group, the Coinbase group or a watched group joins it (marked “joined · first ETH” or “joined · gas top-up”). A larger ETH transfer is weak evidence: it could be a payment. A <i>paid purchase</i> (one wallet signed a swap that delivered GME from the pool straight to another) is weak too: checking them showed most signers are trading-bot executors that sign for many unrelated buyers (one buyer's purchases signed by up to 17 different executors, one executor signing for up to 15 buyers), so a signature alone does not show one owner. Two wallets whose first ETH came from the same private wallet (2 to 8 of them per funder) are an inferred link. ETH sent one way while GME went the other way between the same two wallets looks like a sale and is left out. Exchanges never link anyone: labelled hot wallets, any sender with more than 50,000 transactions, and any wallet that sent ETH to more than 12 studied wallets or received from more than 8. Weak and inferred links never group wallets; they are listed as leads on the ETH side page, next to the strong links between two existing groups (those are not merged: each group keeps the wallets it was built from).</p>
    <p>Guards: an address that seeds more than 40 wallets is a hub, so nothing links through it. A group larger than 60 wallets is flagged and never trusted. A shared exchange or relayer funder never links anyone. Tiny “address poisoning” transfers never link anyone. fbb4's base group stops two steps away from its main wallet (wallets joined later by following the coins have no step limit).</p>
    <p><b>Direct</b> describes the evidence, a transfer between the two wallets that anyone can check on-chain. It is not proof that one person controls both. <b>Inferred</b> means the link comes from a shared counterparty or a grouping rule, with no transfer between the two.</p>
    <div class="callout">Wallet links are evidence of shared control, not proof of ownership. Groups are a floor, not a ceiling: the rules err toward not merging.</div></div></section>
  <section><span class="dn">05 · Classifications</span><div><h2>How statuses are assigned</h2>
    <ul><li><b>Insider status</b> (fbb4's group, 30 days): DISTRIBUTING if it sent ≥0.05% of supply to exchanges; SELLING if it sold more than it bought on the DEX and shrank; ACCUMULATING if it grew by more than 0.05% of supply; otherwise HOLDING. The tripwire arms on any exchange deposit in 7 days, or a DEX sale by fbb4's main wallet in 30 days.</li>
    <li><b>Wallet monitor</b>: every wallet holding ≥0.1% of supply now or at any point in 90 days, plus its linked side wallets. A status needs a change of at least 0.5% of the wallet's balance. Selling means at least half of what left went to the DEX or an exchange. Moves between wallets of the same owner group are shown as own-wallet moves, not as buying or selling; in the owner view they cancel out.</li>
    <li><b>Entity status</b> (per window): accumulating if the group gained more than 1% of its holdings (and at least 0.01% of supply) from outside; when it lost that much, distributing if at least half went to exchanges, selling if at least half went to the DEX or exchanges, moving out otherwise; holding if it moved less; dormant if nothing moved. Internal moves never count.</li>
    <li><b>Entity tripwires</b> (since the last run): first exchange deposit or first DEX sale in 90 days, ≥0.05% of supply moved to wallets outside the group, a new provisional wallet holding ≥0.05% of supply, a group starting to form (first GME in the last 60 days, or +50% in 30 days, with ≥0.1% of supply), and wallets joined by following the coins. High and medium tripwires are also posted as a comment on the repository's “GME terminal alerts” issue.</li>
    <li><b>Entity cost basis</b>: first in, first out over the group's own inflows and outflows. Coins that arrived by transfer rather than a purchase are costed at that day's price.</li>
    <li><b>Quiet accumulators</b>: owners that added ≥0.1% of supply in 90 days and sold under 15% of it.</li>
    <li><b>Buy-and-hide</b>: fresh wallets fed by wallets that bought on the DEX and forwarded ≥80% of it. One counts as “still holding” only if it kept ≥80% of what it received and sold or deposited ≤20%.</li>
    <li><b>Unusual day</b>: transfers or value moved at least 3× the median of the previous 30 days. A display rule that points at days worth inspecting.</li></ul></div></section>
  <section><span class="dn">06 · Crowd</span><div><h2>Owners, not wallets</h2>
    <p>The Crowd page counts owners: an entity (all its wallets together) or a single wallet. Moves between one entity's wallets are never buying, selling or leaving. Only market flows count: GME arriving from the DEX or an exchange is a buy, GME going to them is a sale.</p>
    <ul><li><b>Buyer types:</b> new (the owner never held GME), returning (held before, but had 1M GME or less), adding (already holding).</li>
    <li><b>Seller types:</b> sold out (1M GME or less left) or kept a position; in profit or at a loss against the owner's average cost. Average cost = every inflow at that day's price; a transfer out to another owner lowers it in proportion; a sale realizes the difference.</li>
    <li><b>Arrival quarter:</b> the quarter the owner first received GME. Survival = owners still holding more than 1M GME ÷ owners that arrived.</li>
    <li><b>Smart money:</b> owners with at least $5k of realized profit and at least 100% on the coins they sold. Picked by today's record, so their history is a hindsight read.</li>
    <li><b>Valuation composite:</b> MVRV (25%), supply in profit (25%), price against its 140-day average (30%) and 30-day DEX net flow against pool depth (20%), each ranked against its own earlier values only, from 60 days of data on. 0 = lowest in its own past, 1 = highest.</li>
    <li><b>Pool and overhang calculator:</b> constant-product arithmetic on today's reserves. Multiplying the price by r takes ETH × (√r − 1) of net buying with no sellers. Overhang = held supply bought between today's price and the target, from the cost engine; if a share of it sells at break-even, the extra buying needed is roughly that share × its cost.</li></ul></div></section>
  <section><span class="dn">07 · Limits</span><div><h2>What the data cannot tell you</h2>
    <ul><li>Ethereum only. GME on other chains is not covered (MEXC's GME is the Solana token, not this one).</li>
    <li>What happens inside an exchange is invisible. A deposit is not proof of a sale, and only labelled exchange wallets are recognised; a deposit to an unlabelled address reads as a wallet-to-wallet transfer.</li>
    <li>Owner groups are a lower bound. A wallet funded only through an exchange or another chain cannot be linked from token transfers.</li>
    <li>A wallet that receives coins from a group but meets no linking rule stays outside the group (shown as provisional) until a rule fires. Until then, the group shows those coins as moved out, never as sold.</li>
    <li>Dollar values use daily prices. The market is thin, so small trades move the metrics. Every read describes a position, never a buy or sell signal. Nothing here is financial advice.</li></ul></div></section>
  <section><span class="dn">08 · Freshness</span><div><h2>Live index and research are separate</h2>
    <p>The index is rebuilt every 4 hours by a scheduled job, and fully once a day (06:23 UTC) including the external lookups of ETH funders. GitHub often starts scheduled jobs late. The header shows when it last ran and turns to “Data stale” after 12 hours without a new run. The last day in every daily chart is partial: it runs up to the latest indexed transfer.</p>
    <p>The written study is a snapshot of ${STUDY_DATE}. The daily run does not update its findings. <a class="more" href="/study.html">Read the full study →</a></p></div></section>

  g1.append("g").attr("class", "gridl").call(d3.axisLeft(y1).tickValues(tv).tickSize(-w2).tickFormat(""));
  g1.append("g").attr("class", "axis").call(d3.axisLeft(y1).tickValues(tv).tickFormat(tickP));
  g1.append("path").datum(pr).attr("fill", "none").attr("stroke", C("--fg-2")).attr("stroke-width", 1.2).attr("d", d3.line().x((r) => x(r.d)).y((r) => y1(r.p)));
  // 2 · holdings
  const g2 = g.append("g").attr("transform", `translate(0,${h1 + gap})`); lab(g2, "Holdings, GME");
  const y2 = d3.scaleLinear([0, d3.max(rows, (r) => r.h) * 1.08 || 1], [h2, 0]).nice(2);
  g2.append("g").attr("class", "axis").call(d3.axisLeft(y2).ticks(2).tickFormat((v) => fBb(v)));
  g2.append("path").datum(rows).attr("fill", C("--accent")).attr("fill-opacity", 0.16).attr("stroke", C("--accent")).attr("stroke-width", 1.3)
    .attr("d", d3.area().x((r) => x(r.d)).y0(h2).y1((r) => y2(r.h)));
  // 3 · profit and loss, $
  const g3 = g.append("g").attr("transform", `translate(0,${h1 + gap + h2 + gap})`); lab(g3, "Profit and loss, $ (since first activity)");
  const vals = rows.flatMap((r) => [r.rz, r.un, r.tot]).filter((v) => v != null);
  const y3 = d3.scaleLinear(d3.extent(vals.concat([0])), [h3, 0]).nice(4);
  g3.append("g").attr("class", "gridl").call(d3.axisLeft(y3).ticks(4).tickSize(-w2).tickFormat(""));
  g3.append("g").attr("class", "axis").call(d3.axisLeft(y3).ticks(4).tickFormat((v) => fU(v)));
  g3.append("line").attr("x1", 0).attr("x2", w2).attr("y1", y3(0)).attr("y2", y3(0)).attr("stroke", C("--fg-2")).attr("stroke-width", 1).attr("stroke-dasharray", "2 3");
  const ln = (k, c, wd, dash) => g3.append("path").datum(rows.filter((r) => r[k] != null)).attr("fill", "none").attr("stroke", C(c)).attr("stroke-width", wd).attr("stroke-dasharray", dash || null)
    .attr("d", d3.line().x((r) => x(r.d)).y((r) => y3(r[k])));
  ln("un", "--s1", 1.3, "4 3"); ln("rz", "--accent", 1.6); ln("tot", "--fg", 1.9);
  g3.append("g").attr("class", "axis").attr("transform", `translate(0,${h3})`).call(d3.axisBottom(x).ticks(mob ? 4 : 6));
  // crosshair (under the trade markers, so a marker can still be hovered)
  const bis = d3.bisector((r) => r.d).center, xl = g.append("line").attr("class", "xhair").attr("y1", 0).attr("y2", h1 + gap + h2 + gap + h3).style("opacity", 0);
  const byDay = d3.group(mk, (q) => q.i);
  g.append("rect").attr("width", w2).attr("height", h1 + gap + h2 + gap + h3).attr("fill", "transparent").style("touch-action", "pan-y")
    .on("pointermove", (ev) => { const [mx] = d3.pointer(ev, g.node()), r = rows[Math.max(0, Math.min(rows.length - 1, bis(rows, x.invert(mx))))];
      xl.attr("x1", x(r.d)).attr("x2", x(r.d)).style("opacity", 1);
      showTip(`<div class="h">${fd(r.d)}</div>` + trow("", "market cap", fP(r.p)) + trow(C("--accent"), "holds", fBb(r.h)) + trow("", "avg cost of held, as MC", r.h > 1e-6 ? fP(r.c / (r.h * 1e9)) : "—")
        + trow(C("--accent"), "realized", fU(r.rz)) + trow(C("--s1"), "unrealized", fU(r.un)) + trow(C("--fg"), "total P/L", fU(r.tot))
        + (byDay.get(r.i) || []).map((q) => trow(C(PLK[q.k][1]), PLK[q.k][0], `${fBb(q.b)} · ${fU(q.u)}`)).join(""), ev); })
    .on("pointerleave", () => { xl.style("opacity", 0); hideTip(); });
  const rr = d3.scaleSqrt([0, d3.max(mk, (q) => q.u) || 1], [2.5, mob ? 11 : 14]);
  g.append("g").selectAll("circle").data(mk.filter((q) => q.px > 0).sort((a, b) => b.u - a.u)).join("circle")   // above the crosshair layer
    .attr("cx", (q) => x(DD[q.i])).attr("cy", (q) => y1(q.px)).attr("r", (q) => rr(q.u))
    .attr("fill", (q) => (PLK[q.k][2] ? C(PLK[q.k][1]) : "none")).attr("fill-opacity", 0.55).attr("stroke", (q) => C(PLK[q.k][1])).attr("stroke-width", (q) => (PLK[q.k][2] ? 1 : 1.6))
    .on("pointermove", (ev, q) => showTip(`<div class="h">${fd(DD[q.i])} · ${PLK[q.k][0]}</div>` + trow("", "GME", fBb(q.b)) + trow("", "≈ $", fU(q.u)) + trow("", PLK[q.k][2] ? "bought/sold at MC (avg)" : "MC that day", fP(q.px)), ev))
    .on("pointerleave", hideTip);
  const lg = el.parentElement.querySelector(".pl-legend");
  if (lg) lg.innerHTML = Object.values(PLK).map(([l, c, f]) => `<span><i style="${f ? `background:${C(c)}` : `border:1.5px solid ${C(c)};background:none`};border-radius:50%"></i>${l}</span>`).join("")
    + `<span><i class="ln" style="background:${C("--fg")}"></i>total P/L</span><span><i class="ln" style="background:${C("--accent")}"></i>realized</span><span><i class="dash" style="border-color:${C("--s1")}"></i>unrealized</span>`;
}
const plBox = (key) => `<div class="pl-box" data-plkey="${esc(key)}"><div class="ctl" style="margin-bottom:8px">${segBtns(PLR, plRange, "plr")}</div><div class="chart pl-chart"></div><div class="legend pl-legend"></div></div>`;
function wirePl(root, P) {
  const box = root.querySelector(".pl-box"); if (!box) return;
  const draw = () => behaviourChart(box.querySelector(".pl-chart"), P);
  box.querySelector(".ctl").onclick = (ev) => { const b = ev.target.closest("[data-plr]"); if (!b) return; plRange = +b.dataset.plr; box.querySelectorAll("[data-plr]").forEach((x) => x.classList.toggle("on", +x.dataset.plr === plRange)); draw(); };
  draw();
}
const PLNOTE = "Oldest coins sold first (FIFO). A DEX buy costs what was actually paid; anything else that arrives (exchange withdrawal, transfer, liquidity removed) is costed at that day's close. Sales are DEX sales and exchange deposits (treated as sales); they realize profit or loss. Coins sent to other wallets, added to liquidity or burned leave at cost, with no profit or loss. Unrealized = holdings × the day's close − cost of the coins still held. Prices are shown as market cap (price × 420.69B supply). Markers: filled = DEX trade at its average execution price for the day; ring = exchange deposit or withdrawal at the day's close.";
const plKv = (now) => now ? [["Bought (DEX + exch.)", fU(now.bu)], ["Sold (DEX + exch.)", fU(now.so)], ["Realized P/L", sgn(now.rz, fU)], ["Unrealized P/L", sgn(now.un, fU)], ["Total P/L", sgn(now.tot, fU)], ["Avg cost of held, as MC", now.h > 1e-6 ? fP(now.c / (now.h * 1e9)) : "—"]] : [];
// Group profile (entities.py → pnl.json ents[id].profile): buying waves, sweeps between its own wallets, where the
// buys were executed, and the hour of day (UTC) they happened.
function profileHtml(pr) {
  if (!pr || !pr.buys) return "";
  const tot = d3.sum(pr.venues, (v) => v[1]) || 1, mxh = d3.max(pr.hours) || 1, W = 24 * 14;
  const hours = `<svg viewBox="0 0 ${W} 74" width="100%" height="74" preserveAspectRatio="none" style="display:block;max-width:520px">` +
    pr.hours.map((n, h) => `<rect x="${h * 14 + 1}" y="${60 - (52 * n) / mxh}" width="12" height="${Math.max(n ? 1.5 : 0, (52 * n) / mxh)}" fill="var(--accent)" fill-opacity="${n ? 0.85 : 0}" data-tip="${String(h).padStart(2, "0")}:00–${String(h).padStart(2, "0")}:59 UTC · ${n} buy${n === 1 ? "" : "s"} · ${fU(pr.hoursUsd[h])}"></rect>`).join("") +
    [0, 6, 12, 18].map((h) => `<text x="${h * 14 + 1}" y="72" font-size="9" fill="var(--muted)" font-family="var(--mono)">${String(h).padStart(2, "0")}h</text>`).join("") + `</svg>`;
  return `<div><span class="eyebrow">Buying waves · ${pr.nWaves} wave${pr.nWaves === 1 ? "" : "s"}, ${fN(pr.buys)} buys${pr.nWaves > pr.waves.length ? ` · the ${pr.waves.length} largest shown` : ""}</span>
    <div class="tw" style="margin-top:6px"><table><thead><tr><th>Dates</th><th class="n">Wallets</th><th class="n">Buys</th><th class="n">Spent</th><th class="n">Avg MC</th><th class="n">Worth today</th><th>Mostly via</th></tr></thead><tbody>` +
    pr.waves.map((w) => { const ch = w.usd ? (100 * (w.now - w.usd)) / w.usd : null;
      return `<tr><td class="num">${w.a === w.b ? w.a : w.a + " → " + w.b}</td><td class="n">${w.wallets}</td><td class="n">${fN(w.n)}</td><td class="n">${fU(w.usd)}</td><td class="n">${w.mc ? fMcap(w.mc) : "—"}</td><td class="n">${fU(w.now)} <small class="${ch >= 0 ? "up" : "down"}">${ch == null ? "" : sgn(ch, fPct)}</small></td><td class="flat" style="white-space:normal">${esc(w.via || "—")}</td></tr>`; }).join("") +
    `</tbody></table></div><p class="sub" style="margin-top:6px">A wave is a run of market buys (DEX or exchange withdrawal) with no gap longer than ${pr.gap} days. “Worth today” values the GME bought in that wave at today's market cap, whether or not those exact coins are still held.</p></div>
    <div><span class="eyebrow">Where the buys were executed</span><div class="tw" style="margin-top:6px"><table><tbody>` +
    pr.venues.map(([n, u]) => `<tr><td style="white-space:normal">${esc(n)}</td><td class="n">${fU(u)}</td><td class="n">${fPct((100 * u) / tot, 0)}</td><td><div class="bar"><i style="width:${(100 * u) / tot}%"></i></div></td></tr>`).join("") +
    `</tbody></table></div><p class="sub" style="margin-top:6px">The address the bought GME came from. “Straight from the pool” means an app or bot told the pool to pay the wallet directly, so the app itself is not visible.</p></div>
    <div><span class="eyebrow">Hour of day the buys happened (UTC)</span><div style="margin-top:8px">${hours}</div></div>` +
    (pr.sweeps.length ? `<div><span class="eyebrow">Sweeps between its own wallets</span><div class="tw" style="margin-top:6px"><table><thead><tr><th>Date</th><th>Into</th><th class="n">From</th><th class="n">GME</th></tr></thead><tbody>` +
      pr.sweeps.map((x) => `<tr><td class="num">${x.d}</td><td><button class="addr" data-addr="${x.into}">${short(x.into)}</button></td><td class="n">${x.n} wallet${x.n === 1 ? "" : "s"}</td><td class="n">${fBb(x.tok / 1e9)}</td></tr>`).join("") +
      `</tbody></table></div><p class="sub" style="margin-top:6px">Days when one of the group's wallets received GME from 3 or more of its other wallets, or at least 0.1% of supply in total. Internal: not buying or selling.</p></div>` : "");
}
async function openEntity(id) {
  const e = S.E && S.E.entities.find((x) => x.id === id); if (!e) return;
  $("scrim").classList.add("on"); $("drawer").classList.add("open");
  $("dh").innerHTML = `<span style="font-weight:600">${nm(e.name)}</span><span class="ev inf">${KINDE[e.kind] || e.kind}</span><button class="mini" type="button" data-emap="${e.id}">Entity map →</button><a class="mini" href="#visualizer/${e.id}">Visualize →</a><button class="x" type="button" aria-label="Close">×</button>`;
  $("dh").querySelector(".x").onclick = closeWallet;
  $("dh").querySelector("[data-emap]").addEventListener("click", closeWallet);
  $("db").innerHTML = `<p class="sub">Loading…</p>`;
  const P = (await loadPnl()).ents[id], now = plNow(P);
  const kv = [["Holds", fBb(e.bal / 1e9) + " GME"], ["% of supply", fPct(e.pct, 2)], ["Wallets", e.n + (e.attached.length ? ` (+${e.attached.length} joined)` : "")], ...plKv(now)];
  const big = ((P && P.marks) || []).slice().sort((a, b) => b[3] - a[3]).slice(0, 12), off = d0off();
  $("db").innerHTML = `<div class="kv">${kv.map(([k, v]) => `<div><b>${esc(v)}</b><span>${k}</span></div>`).join("")}</div>
    <div><span class="eyebrow">How it traded · the whole group as one owner</span><div style="margin-top:6px">${plBox("e:" + id)}</div><p class="sub" style="margin-top:6px">${PLNOTE} Moves between the group's own wallets are internal: neither buys nor sales.</p></div>
    ${profileHtml(P && P.profile)}
    ${big.length ? `<div><span class="eyebrow">Largest trades</span><div class="tw" style="margin-top:6px"><table><thead><tr><th>Date</th><th>Action</th><th class="n">GME</th><th class="n">≈ $</th><th class="n">At MC</th></tr></thead><tbody>` +
      big.map(([d, k, b, u]) => `<tr><td class="num">${fday(DD[d + off] || DD[N - 1])}</td><td class="${PLK[k][1] === "--up" ? "up" : "down"}">${PLK[k][0]}</td><td class="n">${fBb(b)}</td><td class="n">${fU(u)}</td><td class="n">${PLK[k][2] ? fP(u / (b * 1e9)) : "—"}</td></tr>`).join("") + `</tbody></table></div></div>` : ""}
    <div><span class="eyebrow">Wallets (${e.n})</span><div class="chips" style="margin-top:6px">${e.members.slice(0, 120).map((a) => `<button class="addr" data-addr="${a}">${short(a)}</button>`).join("")}</div></div>`;
  wirePl($("db"), P);
}
})();
