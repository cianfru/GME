<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GME Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>try { const t = localStorage.getItem("gme-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root { --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif }
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f1ee; --panel: #fcfcfb; --panel-2: #f5f5f2; --fg: #0b0b0b; --fg-2: #52514e; --muted: #75746f; --line: #e0dfda; --grid: #ebeae6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --up: #0a8a3a; --down: #c93636; --good: #0ca30c; --warn: #b07800; --crit: #d03b3b; --neutral: #a9a8a2; --accent: #2a78d6;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0c0b; --panel: #161615; --panel-2: #1c1c1a; --fg: #f0efec; --fg-2: #c3c2b7; --muted: #8d8c85; --line: #2a2a27; --grid: #22221f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --up: #3fbf6b; --down: #ef6b6b; --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --neutral: #5d5c57; --accent: #3987e5;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); overflow-x: hidden; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1 }
button, input, select, svg text { font-family: var(--font); font-variant-numeric: tabular-nums }
.mono, .num { font-family: var(--font); font-variant-numeric: tabular-nums }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 0 }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line) }
.bar { display: flex; align-items: stretch; gap: 0; max-width: 1400px; margin: 0 auto; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)) }
.brand { display: flex; align-items: center; gap: .5rem; padding: .7rem 1rem .7rem 0; border-right: 1px solid var(--line); white-space: nowrap;
  font: 600 13px var(--font); letter-spacing: .08em }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent) }
.brand.stale i { background: var(--crit); box-shadow: 0 0 0 3px color-mix(in srgb, var(--crit) 25%, transparent) }
.tick { display: flex; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0 }
.tick::-webkit-scrollbar { display: none }
.tk { display: flex; flex-direction: column; justify-content: center; padding: .45rem 1rem; border-right: 1px solid var(--line); white-space: nowrap; min-width: max-content }
.tk .k { font: 500 10px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.tk .v { font: 600 15px var(--font) }
.tk .d { font: 500 11px var(--font) }
.up { color: var(--up) } .down { color: var(--down) } .flat { color: var(--muted) }
.icon-btn { background: none; border: 0; border-left: 1px solid var(--line); padding: 0 .9rem; cursor: pointer; color: var(--fg-2); min-width: 44px }
.tabsrow { display: flex; align-items: center; max-width: 1400px; margin: 0 auto; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line) }
.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0 }
.tabs::-webkit-scrollbar { display: none }
.tabs a { padding: .65rem 1rem; font: 600 12px var(--font); letter-spacing: .08em; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; min-height: 40px; display: flex; align-items: center }
.tabs a.on { color: var(--fg); border-bottom-color: var(--accent) }
.tabs .sp { flex: 1 }
.range { display: flex; align-items: center; gap: 2px; padding-left: .5rem; flex: none; border-left: 1px solid var(--line) }
@media (max-width: 640px) { .tabs a { padding: .65rem .7rem } .range button { padding: .3rem .4rem } }
.range button { background: none; border: 1px solid transparent; border-radius: 0; padding: .3rem .55rem; font: 600 11px var(--font); color: var(--muted); cursor: pointer; min-height: 32px }
.range button.on { color: var(--fg); border-color: var(--line); background: var(--panel) }

/* layout */
main { max-width: 1400px; margin: 0 auto; padding: 14px max(12px, env(safe-area-inset-right, 0px)) 60px max(12px, env(safe-area-inset-left, 0px)) }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.wide { grid-column: 1 / -1 }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 14px 16px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px }
.card > header { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; flex-wrap: wrap }
.card h3 { margin: 0; font: 600 12px var(--font); letter-spacing: .07em; text-transform: uppercase; color: var(--fg-2) }
.card .val { font: 600 18px var(--font); white-space: nowrap }
.card .val small { font-size: 12px; margin-left: .4rem }
.card .sub { margin: 0; color: var(--muted); font-size: 12.5px }
.card .note { color: var(--muted); font-size: 11.5px; margin-top: 2px }
.chart { position: relative; width: 100%; min-height: 160px }
.chart svg { display: block; width: 100%; overflow: visible }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: 12px; color: var(--fg-2) }
.legend span { display: inline-flex; align-items: center; gap: .4rem }
.legend i { width: 10px; height: 10px; border-radius: 0; flex: none }
.legend i.ln { height: 2px; width: 14px; border-radius: 0 }
.axis text { font: 400 10.5px var(--font); fill: var(--muted) }
.axis line { stroke: var(--line) } .axis .domain { display: none }
.gridl line { stroke: var(--grid) } .gridl .domain { display: none }
.lbl { font: 500 10.5px var(--font); fill: var(--fg-2) }
.xhair { stroke: var(--fg-2); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none }

/* status */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem 1.2rem }
.badge { display: inline-flex; align-items: center; gap: .5rem; padding: .35rem .75rem; border-radius: 0; font: 600 14px var(--font); letter-spacing: .06em; border: 1px solid }
.badge.ACCUMULATING { color: var(--up); border-color: var(--up) }
.badge.HOLDING { color: var(--fg-2); border-color: var(--line) }
.badge.SELLING { color: var(--warn); border-color: var(--warn) }
.badge.DISTRIBUTING { color: var(--crit); border-color: var(--crit) }
.trip { font: 500 12.5px var(--font); padding: .3rem .6rem; border-radius: 0; border: 1px dashed var(--line); color: var(--fg-2) }
.trip.armed { border-style: solid; border-color: var(--crit); color: var(--crit) }

/* tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px }
table { border-collapse: collapse; width: 100%; font-size: 12.5px }
th, td { padding: .42rem .55rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle }
th { font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--panel); cursor: default }
th.s { cursor: pointer } th.s:hover { color: var(--fg) }
td.n, th.n { text-align: right; font-family: var(--font); font-variant-numeric: tabular-nums }
tr:last-child td { border-bottom: 0 }
tbody tr:hover { background: var(--panel-2) }
.addr { font-family: var(--font); color: var(--accent); cursor: pointer; text-decoration: none; background: none; border: 0; padding: 0; font-size: inherit }
.addr:hover { text-decoration: underline }
.tag { display: inline-block; font: 500 10.5px var(--font); padding: .08rem .45rem; border-radius: 0; border: 1px solid var(--line); color: var(--fg-2); margin-right: .25rem }
.sev { font: 600 10.5px var(--font); letter-spacing: .05em }
.sev.high { color: var(--crit) } .sev.medium { color: var(--warn) } .sev.info { color: var(--muted) }
.alist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.alist li { display: grid; grid-template-columns: 6.2rem 1fr; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--line); font-size: 12.5px }
.alist li:last-child { border-bottom: 0 }
details.grp summary { cursor: pointer; list-style: none }
details.grp summary::-webkit-details-marker { display: none }
.chips { display: flex; flex-wrap: wrap; gap: .3rem .6rem; padding: .4rem 0 .2rem; white-space: normal }
.spark { display: block }

/* wallet drawer */
#drawer { position: fixed; inset: 0 0 0 auto; width: min(760px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 40;
  transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; box-shadow: -12px 0 40px rgb(0 0 0 / .35) }
#drawer.open { transform: none }
#drawer .dh { display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line) }
#drawer .db { overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem }
#drawer .x { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 0; min-width: 40px; min-height: 40px; cursor: pointer; font-size: 18px }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .6rem }
.kv div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 0; padding: .5rem .65rem }
.kv b { display: block; font: 600 15px var(--font) }
.kv span { font-size: 11px; color: var(--muted) }
#scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 35; display: none }
#scrim.on { display: block }

/* monitor + bubble map */
.ctl { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 0; overflow: hidden }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: .35rem .65rem; font: 600 11px var(--font); color: var(--muted); cursor: pointer; min-height: 34px }
.seg button:last-child { border-right: 0 }
.seg button.on { background: var(--panel-2); color: var(--fg) }
.chip { background: none; border: 1px solid var(--line); border-radius: 0; padding: .3rem .7rem; font: 500 12px var(--font); color: var(--fg-2); cursor: pointer; min-height: 34px }
.chip.on { border-color: var(--fg-2); color: var(--fg) }
.chip b { font-weight: 600 }
input.q, select.q { background: var(--panel-2); border: 1px solid var(--line); border-radius: 0; color: var(--fg); padding: .4rem .6rem; font: 500 12px var(--font); min-height: 34px }
input.q { width: 14rem; max-width: 100% }
select.q { max-width: 100% }
.st-acc { color: var(--up) } .st-sell { color: var(--down) } .st-move { color: var(--warn) } .st-int, .st-flat, .st-dorm { color: var(--muted) }
tr.r-acc td:first-child { box-shadow: inset 3px 0 var(--up) } tr.r-sell td:first-child { box-shadow: inset 3px 0 var(--down) } tr.r-move td:first-child { box-shadow: inset 3px 0 var(--warn) }
.how { white-space: normal; min-width: 14rem }
.how span { display: inline-block; margin: 0 .5rem .1rem 0; font: 500 11px var(--font) }
.sumline { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; font: 500 12.5px var(--font) }
.ownlink { background: none; border: 0; padding: 0; color: var(--fg-2); cursor: pointer; font: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px }
#bub svg text { pointer-events: none }
#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 0;
  padding: .5rem .65rem; font-size: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .35); opacity: 0; transition: opacity .1s; max-width: 300px }
#tip .r { display: flex; justify-content: space-between; gap: 1rem; align-items: center }
#tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 0; margin-right: .35rem }
#tip b { font: 500 12px var(--font) }
#tip .h { font: 600 11px var(--font); color: var(--muted); margin-bottom: .2rem }
footer { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: .4rem 1.4rem }
#err { display: none; margin: 1rem; padding: 1rem; border-radius: 0; border: 1px solid var(--crit); color: var(--crit) }
@media (max-width: 640px) { .tk { padding: .4rem .7rem } .card { padding: 12px } .brand { padding-right: .7rem } .brand span { display: none } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand" id="brand" title=""><i></i><b style="font-weight:inherit">GME<span>/ETH TERMINAL</span></b></div>
    <div class="tick" id="tick"></div>
    <button class="icon-btn" id="theme" aria-label="Switch light/dark">◐</button>
  </div>
  <div class="tabsrow"><nav class="tabs" id="tabs" aria-label="Sections"></nav><div class="range" id="range" role="group" aria-label="Chart range"></div></div>
</header>
<div id="err" role="alert"></div>
<main id="view"></main>
<footer>
  <span id="asof"></span>
  <span>Every GME transfer from public Ethereum nodes, rebuilt daily · prices: DeFiLlama · wallet links are evidence of shared control, not proof of ownership · not financial advice</span>
  <a href="/study.html">Full study ↗</a>
</footer>
<div id="scrim"></div>
<aside id="drawer" aria-label="Wallet"><div class="dh" id="dh"></div><div class="db" id="db"></div></aside>
<div id="tip" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const SUPPLY = 420.69e9, FOCUS = "0xe14767042159e5bd2bf16f81a0fe387ab153fbb4";
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-4) : "");
const fB = (t) => t == null ? "—" : Math.abs(t) >= 1e9 ? (t / 1e9).toFixed(Math.abs(t) >= 1e10 ? 1 : 2) + "B" : Math.abs(t) >= 1e6 ? Math.round(t / 1e6) + "M" : Math.round(t).toLocaleString("en-US");
const fBb = (b) => fB(b * 1e9);                  // value already in billions
const fU = (u) => u == null ? "—" : u < 0 ? "−" + fU(-u) : Math.abs(u) >= 1e6 ? "$" + (u / 1e6).toFixed(2) + "M" : Math.abs(u) >= 1e4 ? "$" + (u / 1e3).toFixed(0) + "k" : Math.abs(u) >= 1e3 ? "$" + (u / 1e3).toFixed(1) + "k" : "$" + Math.round(u);
const fP = (p) => (p == null || !isFinite(p) ? "—" : "$" + p.toFixed(Math.max(2, 2 - Math.floor(Math.log10(p)))));
const fPct = (p, d = 1) => (p == null ? "—" : p.toFixed(d) + "%");
const fN = (n) => (n == null ? "—" : Math.round(n).toLocaleString("en-US"));
const sgn = (v, f) => (v > 0 ? "+" : v < 0 ? "−" : "±") + f(Math.abs(v));
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "flat");
const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "•");
const pd = d3.utcParse("%Y-%m-%d"), fd = d3.utcFormat("%-d %b %Y"), fdt = d3.utcFormat("%-d %b %Y %H:%M UTC");
const ETH = (a) => `https://etherscan.io/address/${a}`;
const mobile = () => innerWidth < 640;
const mant = (v) => Math.round(v / 10 ** Math.floor(Math.log10(v) + 1e-9));
const tickP = (v) => "$" + v.toFixed(Math.max(0, -Math.floor(Math.log10(v) + 1e-9)));
const logTicks = (sc, keep) => { const [a, b] = sc.domain(); return [1, 2, 5].flatMap((k) => d3.range(-10, 2).map((e) => k * 10 ** e)).filter((v) => v >= a && v <= b && keep(mant(v))).sort((p, q) => p - q); };

// ---------- tooltip ----------
const tip = $("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
const trow = (c, k, v) => `<div class="r"><span>${c ? `<i style="background:${c}"></i>` : ""}${esc(k)}</span><b>${esc(v)}</b></div>`;

// ---------- state ----------
let S, T, DD, N;          // site.json, terminal data, parsed dates, length
const RANGES = [["30D", 30], ["90D", 90], ["1Y", 365], ["ALL", 0]];
let range = 90;
try { range = +(localStorage.getItem("gme-range") ?? 90); } catch (e) {}
const TABS = [["overview", "OVERVIEW"], ["wallets", "WALLETS"], ["bubbles", "BUBBLE MAP"], ["insiders", "INSIDERS"], ["watchlist", "WATCHLIST"], ["valuation", "VALUATION"], ["holders", "HOLDERS"], ["flows", "FLOWS"]];
let tab = (location.hash.slice(1) || "overview");
const draws = [];        // chart draw functions for the current tab (re-run on resize/theme/range)

fetch("/site.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error("site.json " + r.status); return r.json(); }).then((d) => {
  S = d; T = d.T; DD = T.daily.d.map(pd); N = DD.length; init();
}).catch((e) => { $("err").style.display = "block"; $("err").textContent = "Could not load the data (" + e.message + ")."; console.error(e); });

// ---------- helpers on the daily series ----------
const col = (k) => T.daily[k];
const lastIdx = (a) => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return i; return -1; };
const lastVal = (a) => a[lastIdx(a)];
const ago = (a, n) => { const i = lastIdx(a) - n; return i >= 0 ? a[i] : null; };
const sumLast = (a, n) => d3.sum(a.slice(-n));
const roll = (a, n) => a.map((_, i) => { const s = a.slice(Math.max(0, i - n + 1), i + 1).filter((x) => x != null); return s.length ? d3.mean(s) : null; });
const startIdx = () => (range ? Math.max(0, N - range) : 0);

function init() {
  // ticker
  const price = col("price"), p0 = lastVal(price);
  const ageH = (Date.now() - new Date(T.asOf)) / 3.6e6;
  $("brand").title = "Data as of " + fdt(new Date(T.asOf));
  if (ageH > 36) $("brand").classList.add("stale");
  $("asof").textContent = "Data as of " + fdt(new Date(T.asOf)) + (ageH > 36 ? " · STALE: the daily run may have failed" : "");
  const chg = (a, n) => { const v = lastVal(a), o = ago(a, n); return o ? (100 * (v - o)) / o : null; };
  const cl = col("cluster"), hold = col("holders"), pool = col("pool");
  const tk = [
    ["Price", fP(p0), chg(price, 1), "24h", (v) => fPct(Math.abs(v))],
    ["7d", fPct(chg(price, 7) ?? 0), null],
    ["Mkt cap", fU(p0 * SUPPLY), null],
    ["Pool", T.pool.weth.toFixed(1) + " ETH", null, "", null, fBb(T.pool.gme / 1e9) + " GME"],
    ["Holders", fN(lastVal(hold)), lastVal(hold) - ago(hold, 30), "30d", (v) => fN(v)],
    ["MVRV", (lastVal(col("mvrv")) ?? 0).toFixed(2) + "×", null, "", null, "in profit " + fPct(lastVal(col("sip")), 0)],
    ["Focus cluster", fPct((100 * lastVal(cl) * 1e9) / SUPPLY), (100 * (lastVal(cl) - ago(cl, 7)) * 1e9) / SUPPLY, "7d", (v) => v.toFixed(2) + "pt"],
    ["Insiders", T.insider.status, null, "", null, T.insider.armed ? "⚠ tripwire armed" : "tripwire quiet"],
  ];
  $("tick").innerHTML = tk.map(([k, v, d, lab, f, sub]) => {
    let dd = "";
    if (d != null && f) dd = `<span class="d ${cls(d)}">${arrow(d)} ${f(d)} ${lab}</span>`;
    else if (k === "7d") { const c = chg(price, 7) ?? 0; return `<div class="tk"><span class="k">Price 7d</span><span class="v ${cls(c)}">${arrow(c)} ${fPct(Math.abs(c))}</span></div>`; }
    else if (sub) dd = `<span class="d flat">${esc(sub)}</span>`;
    const color = k === "Insiders" ? (v === "ACCUMULATING" ? "up" : v === "DISTRIBUTING" || v === "SELLING" ? "down" : "") : "";
    return `<div class="tk"><span class="k">${esc(k)}</span><span class="v ${color}">${esc(v)}</span>${dd}</div>`;
  }).join("");
  // tabs + range

function ts(id, opt) {

        s.vv.forEach((v, i) => { if (v == null) return; const k = idx.get(+wk.floor(dates[i])); out[k] = s.agg === "last" ? v : (out[k] ?? 0) + v; });
        if (s.agg === "mean") keys.forEach((k, j) => { const vs = s.vv.filter((v, i) => +wk.floor(dates[i]) === +k && v != null); out[j] = vs.length ? d3.mean(vs) : null; });
        return { ...s, vv: out }; });
      dates = keys;

    }
    const H = opt.height ?? (mob ? 200 : 230), m = { t: 10, r: opt.right ?? 12, b: 22, l: opt.left ?? (mob ? 46 : 54) };
    el.innerHTML = "";

    const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("height", H);
    const g = svg.append("g").attr("transform", `translate(${m.l},${m.t})`);
    const step = dates.length > 1 ? (dates[dates.length - 1] - dates[0]) / (dates.length - 1) : 864e5;
    const x = d3.scaleUtc([dates[0], +dates[dates.length - 1] + (hasBars ? step : 0)], [0, w]);
    // y domain
    const stacks = ser.filter((s) => s.type === "stack");
    let vals = [];
    ser.forEach((s) => { if (s.type === "line" || s.type === "area") vals.push(...s.vv.filter((v) => v != null)); });
    const pos = new Array(dates.length).fill(0), negs = new Array(dates.length).fill(0);
    ser.filter((s) => s.type === "bar" || s.type === "neg").forEach((s) => {

        if (val >= 0) { const r = [pos[i], pos[i] + val]; pos[i] += val; return [i, r, v]; }

    let y;

    else { if (opt.zero !== false || hasBars) { lo = Math.min(0, lo); hi = Math.max(0, hi); } if (opt.yMax) hi = Math.max(hi, opt.yMax); const pad = (hi - lo) * 0.06 || 1;
      y = d3.scaleLinear([lo < 0 ? lo - pad : lo, opt.yMax ? opt.yMax : hi + pad], [h, 0]); if (!opt.yMax) y.nice(4); }
    const fmt = opt.fmt || ((v) => v);

    g.append("g").attr("class", "gridl").call(d3.axisLeft(y).tickValues(yt).tickSize(-w).tickFormat(""));
    g.append("g").attr("class", "axis").call(d3.axisLeft(y).tickValues(yt).tickFormat(opt.log && opt.price ? tickP : opt.axisFmt || fmt));
    g.append("g").attr("class", "axis").attr("transform", `translate(0,${h})`).call(d3.axisBottom(x).ticks(mob ? 4 : 6).tickSizeOuter(0));
    if (!opt.log && y.domain()[0] < 0) g.append("line").attr("x1", 0).attr("x2", w).attr("y1", y(0)).attr("y2", y(0)).attr("stroke", css("--fg-2")).attr("stroke-opacity", 0.5);
    (opt.ref || []).forEach((r) => { g.append("line").attr("x1", 0).attr("x2", w).attr("y1", y(r.y)).attr("y2", y(r.y)).attr("stroke", css("--fg-2")).attr("stroke-dasharray", "4 4");
      g.append("text").attr("class", "lbl").attr("x", w - 4).attr("y", y(r.y) - 4).attr("text-anchor", "end").text(r.label); });
    (opt.bands || []).forEach((b) => { const a = x(pd(b.a)), z = x(pd(b.b)); if (z < 0 || a > w) return;
      g.insert("rect", ":first-child").attr("x", Math.max(0, a)).attr("width", Math.max(1, Math.min(w, z) - Math.max(0, a))).attr("y", 0).attr("height", h).attr("fill", css("--s2")).attr("opacity", 0.1);

    if (stackData) stackData.forEach((layer, j) => {

        .attr("d", d3.area().x((p, i) => x(dates[i])).y0((p) => y(p[0])).y1((p) => y(p[1])).curve(opt.curve || d3.curveLinear));

      } else if (s.type === "area") {

        g.append("path").datum(s.vv.map((v, i) => [i, v]).filter(([, v]) => v != null)).attr("fill", "none").attr("stroke", s.color).attr("stroke-width", s.width || 1.8)

    const L = $(id + "-l");

  };
  draws.push(draw);
}

    `<span><i style="background:${C("--s7")}"></i>DEX</span><span><i style="background:${C("--s4")}"></i>exchanges</span><span><i class="ln" style="background:${C("--muted")}"></i>own wallets (dashed)</span><span><i style="border:1.5px dashed ${C("--fg-2")};background:transparent"></i>another monitored owner</span>`;
  const top = [...L].sort((a, b) => b.v - a.v).slice(0, 25);
  const nl = (n) => (n.kind === "c" ? `<span class="flat">${esc(n.label)}</span>` : `<button class="addr" data-addr="${n.a}">${short(n.a)}</button>`);
  $("bubflows").innerHTML = top.length ? `<div class="tw"><table><thead><tr><th>From</th><th>To</th><th class="n">GME</th><th>What it was</th></tr></thead><tbody>` +
    top.map((l) => { const s = l.source.id, t = l.target.id, kind = s === "D" ? '<span class="up">bought on the DEX</span>' : t === "D" ? '<span class="down">sold on the DEX</span>' : t === "C" ? '<span class="down">deposited to an exchange</span>' : s === "C" ? '<span class="up">withdrawn from an exchange</span>' : typeof s === "number" && typeof t === "number" && sameOwner(s, t) ? '<span class="flat">between own wallets</span>' : "wallet to wallet";
      return `<tr><td>${nl(l.source)}</td><td>${nl(l.target)}</td><td class="n">${fBb(l.v)}</td><td>${kind}</td></tr>`; }).join("") + `</tbody></table></div>`
    : `<p class="sub">No GME moved in or out of these wallets in the last ${wl}.</p>`;
}

// ---------- wallet drawer ----------
let WALLETS = null;
const KIND = { "dex-buy": ["▲ Bought on DEX", "up"], "dex-sell": ["▼ Sold on DEX", "down"], "cex-in": ["◆ From exchange", "up"], "cex-out": ["▲ To exchange", "down"], "lp-add": ["+ Added liquidity", "flat"],
  "lp-remove": ["− Removed liquidity", "flat"], in: ["← Received", "flat"], out: ["→ Sent", "flat"], burn: ["✕ Burned", "flat"] };
async function openWallet(a) {
  a = a.toLowerCase();
  $("scrim").classList.add("on"); $("drawer").classList.add("open");
  $("dh").innerHTML = `<span class="mono" style="font-weight:600">${short(a)}</span><a class="tag" href="${ETH(a)}" target="_blank" rel="noopener">Etherscan ↗</a><a class="tag" href="https://app.zerion.io/${a}/overview" target="_blank" rel="noopener">Zerion ↗</a><button class="x" aria-label="Close">×</button>`;
  $("dh").querySelector(".x").onclick = closeWallet;
  $("db").innerHTML = `<p class="sub">Loading…</p>`;
  if (!WALLETS) { try { WALLETS = await (await fetch("/wallets.json", { cache: "no-store" })).json(); } catch (e) { WALLETS = {}; } }
  const w = WALLETS[a];
  if (!w) { $("db").innerHTML = `<p class="sub">This wallet isn't on the watchlist, so the terminal has no history for it. Open it on Etherscan for the raw transfers.</p><p class="mono">${a}</p>`; return; }
  const sum = (k) => d3.sum(w.events.filter((e) => e[2] === k), (e) => Math.abs(e[1])), usd = (k) => d3.sum(w.events.filter((e) => e[2] === k), (e) => e[3]);
  const kv = [["Holds", fBb(w.bal) + " GME"], ["% of supply", fPct((100 * w.bal * 1e9) / SUPPLY, 3)], ["Group", w.group || "—"], ["First seen", w.first], ["Last active", w.last],
    ["Bought on DEX", fBb(sum("dex-buy")) + " · " + fU(usd("dex-buy"))], ["Sold on DEX", fBb(sum("dex-sell")) + " · " + fU(usd("dex-sell"))], ["To exchanges", fBb(sum("cex-out"))], ["From exchanges", fBb(sum("cex-in"))]];
  $("db").innerHTML = `<div class="mono" style="font-size:12px;color:var(--muted);word-break:break-all">${a}</div><div class="kv">${kv.map(([k, v]) => `<div><b>${esc(v)}</b><span>${k}</span></div>`).join("")}</div>
    <div><h3 class="mono" style="font-size:12px;letter-spacing:.07em;color:var(--fg-2);margin:0 0 .4rem">BALANCE AND PRICE</h3><div class="chart" id="wchart"></div></div>
    <div><h3 class="mono" style="font-size:12px;letter-spacing:.07em;color:var(--fg-2);margin:0 0 .4rem">ACTIVITY (${w.n}${w.n > w.events.length ? ", latest " + w.events.length : ""})</h3>
    <div class="tw"><table><thead><tr><th>Date</th><th>Action</th><th class="n">GME</th><th class="n">≈ $</th><th>Counterparty</th></tr></thead><tbody>` +
    [...w.events].reverse().map((e) => { const [l, c] = KIND[e[2]] || [e[2], "flat"]; const cp = e[4];
      return `<tr><td class="num">${e[0]}</td><td class="${c}">${l}</td><td class="n">${sgn(e[1], fBb)}</td><td class="n">${fU(e[3])}</td><td>${/dex|lp/.test(e[2]) ? '<span class="flat">pool / router</span>' : WALLETS[cp] ? `<button class="addr" data-addr="${cp}">${short(cp)}</button>` : `<a class="mono" href="${ETH(cp)}" target="_blank" rel="noopener">${short(cp)}</a>`}</td></tr>`; }).join("") +
    `</tbody></table></div></div>`;
  walletChart(w);
}
function closeWallet() { $("scrim").classList.remove("on"); $("drawer").classList.remove("open"); hideTip(); }
function walletChart(w) {
  const el = $("wchart"); if (!el || !w.series.length) return;
  const start = pd(w.series[0][0]), dates = DD.filter((d) => d >= start), bmap = new Map(w.series.map(([d, b]) => [d, b]));
  let b = 0; const bal = dates.map((d) => { const k = d3.utcFormat("%Y-%m-%d")(d); if (bmap.has(k)) b = bmap.get(k); return Math.max(0, b); });
  const i0 = DD.indexOf(dates.find((d) => true)), price = col("price").slice(i0);
  const W = el.clientWidth, H = 260, m = { t: 8, r: 10, b: 22, l: 50 }, w2 = W - m.l - m.r, h1 = 140, gap = 22, h2 = H - m.t - m.b - h1 - gap;
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("height", H), g = svg.append("g").attr("transform", `translate(${m.l},${m.t})`);
  const x = d3.scaleUtc(d3.extent(dates), [0, w2]), y = d3.scaleLinear([0, d3.max(bal) * 1.08 || 1], [h1, 0]).nice(3);
  g.append("g").attr("class", "gridl").call(d3.axisLeft(y).ticks(3).tickSize(-w2).tickFormat(""));
  g.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(3).tickFormat((v) => fBb(v)));
  g.append("path").datum(bal).attr("fill", C("--s1")).attr("fill-opacity", 0.25).attr("stroke", C("--s1")).attr("stroke-width", 1.6)
    .attr("d", d3.area().x((v, i) => x(dates[i])).y0(h1).y1((v) => y(v)).curve(d3.curveStepAfter));
  const ev = w.events.filter((e) => /dex-buy|dex-sell|cex-out|cex-in/.test(e[2]));
  const g2 = g.append("g").attr("transform", `translate(0,${h1 + gap})`), pr = price.map((p, i) => [dates[i], p]).filter(([, p]) => p);
  const y2 = d3.scaleLog(d3.extent(pr, (d) => d[1]), [h2, 0]);
  g2.append("text").attr("class", "lbl").attr("y", -6).text("price · ▲ buys ▼ sells");
  g2.append("path").datum(pr).attr("fill", "none").attr("stroke", C("--fg-2")).attr("stroke-width", 1.2).attr("d", d3.line().x((d) => x(d[0])).y((d) => y2(d[1])));
  const pAt = new Map(pr.map(([d, p]) => [d3.utcFormat("%Y-%m-%d")(d), p]));
  g2.selectAll("path.m").data(ev.filter((e) => pAt.has(e[0]))).join("path").attr("transform", (e) => `translate(${x(pd(e[0]))},${y2(pAt.get(e[0]))})`)
    .attr("d", (e) => d3.symbol(d3.symbolTriangle, 40)()).attr("fill", (e) => (/buy|cex-in/.test(e[2]) ? C("--up") : C("--down")))
    .attr("transform", (e) => `translate(${x(pd(e[0]))},${y2(pAt.get(e[0]))}) rotate(${/buy|cex-in/.test(e[2]) ? 0 : 180})`);
  g2.append("g").attr("class", "axis").attr("transform", `translate(0,${h2})`).call(d3.axisBottom(x).ticks(5));
  const bis = d3.bisector((d) => d).center, ln = g.append("line").attr("class", "xhair").attr("y1", 0).attr("y2", h1 + gap + h2).style("opacity", 0);
  svg.append("rect").attr("x", m.l).attr("width", w2).attr("height", H).attr("fill", "transparent").style("touch-action", "pan-y")
    .on("pointermove", (e2) => { const [mx] = d3.pointer(e2, g.node()); const i = Math.max(0, Math.min(dates.length - 1, bis(dates, x.invert(mx)))); ln.attr("x1", x(dates[i])).attr("x2", x(dates[i])).style("opacity", 1);
      showTip(`<div class="h">${fd(dates[i])}</div>` + trow(C("--s1"), "holds", fBb(bal[i])) + trow("", "price", fP(price[i])), e2); })
    .on("pointerleave", () => { ln.style("opacity", 0); hideTip(); });
}
})();
