<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a12">
<title>GME on Ethereum · Terminal</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>try { const t = localStorage.getItem("gme-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root { --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --blur: blur(18px) saturate(1.45); --gut: max(16px, env(safe-area-inset-left, 0px)); --max: 1440px }
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #e7ecf4;
  --bg-grad: radial-gradient(1100px 680px at 6% -8%, rgb(230 186 90 / .34), transparent 62%), radial-gradient(1000px 720px at 104% 4%, rgb(96 140 235 / .30), transparent 60%),
    radial-gradient(900px 700px at 70% 112%, rgb(52 180 160 / .22), transparent 62%), linear-gradient(180deg, #eef2f8 0%, #e1e7f0 100%);
  --glass: rgb(255 255 255 / .58); --glass-2: rgb(255 255 255 / .55); --glass-hdr: rgb(246 248 252 / .72); --glass-pop: rgb(255 255 255 / .92); --th: rgb(248 250 253 / .97);
  --line: rgb(15 23 42 / .10); --line-2: rgb(15 23 42 / .22); --hi: rgb(255 255 255 / .95); --grid: rgb(15 23 42 / .07); --gridbg: rgb(15 23 42 / .04); --corner: rgb(15 23 42 / .5);
  --fg: #0b1220; --fg-2: #434d5e; --muted: #667085; --row: rgb(15 23 42 / .04);
  --accent: #9a6f0b; --accent-2: rgb(154 111 11 / .12);
  --up: #0a8a3a; --down: #c93636; --warn: #c0650f; --crit: #d03b3b; --neutral: #a3abb8;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --shadow: 0 30px 60px -40px rgb(15 23 42 / .35);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #060a12;
  --bg-grad: radial-gradient(1100px 680px at 6% -8%, rgb(214 168 72 / .20), transparent 62%), radial-gradient(1000px 720px at 104% 4%, rgb(58 108 206 / .28), transparent 60%),
    radial-gradient(900px 700px at 70% 112%, rgb(32 150 138 / .18), transparent 62%), linear-gradient(180deg, #060a12 0%, #0a1122 100%);
  --glass: rgb(16 24 40 / .52); --glass-2: rgb(255 255 255 / .035); --glass-hdr: rgb(7 11 20 / .66); --glass-pop: rgb(13 20 34 / .9); --th: rgb(13 20 34 / .97);
  --line: rgb(255 255 255 / .085); --line-2: rgb(255 255 255 / .17); --hi: rgb(255 255 255 / .07); --grid: rgb(255 255 255 / .055); --gridbg: rgb(255 255 255 / .03); --corner: rgb(255 255 255 / .45);
  --fg: #e8edf5; --fg-2: #a9b3c4; --muted: #75819a; --row: rgb(255 255 255 / .04);
  --accent: #d6b15a; --accent-2: rgb(214 177 90 / .13);
  --up: #48c287; --down: #f0706b; --warn: #ee9244; --crit: #f05f5c; --neutral: #5a667c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 30px 60px -36px rgb(0 0 0 / .8);
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; background: var(--bg) }
body { margin: 0; min-height: 100vh; color: var(--fg); font: 14px/1.5 var(--sans); overflow-x: hidden; -webkit-font-smoothing: antialiased; background: transparent }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: var(--bg-grad); pointer-events: none }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--gridbg) 1px, transparent 1px), linear-gradient(90deg, var(--gridbg) 1px, transparent 1px); background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 85%); mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 85%) }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2) }
button { font: inherit; color: inherit; border-radius: 0 }
input, select { border-radius: 0 }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px }
.mono, .num, td.n, .axis text { font-family: var(--mono); font-variant-numeric: tabular-nums }
.eyebrow { font: 500 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.up { color: var(--up) } .down { color: var(--down) } .flat { color: var(--muted) } .mv-move { color: var(--warn) }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gut) }

/* glass + sharp corners */
.panel { position: relative; min-width: 0; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hi), var(--shadow) }
.panel::after { content: ""; position: absolute; inset: -1px; pointer-events: none; --c: var(--corner); --s: 10px;
  background: linear-gradient(var(--c), var(--c)) top left / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) top left / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) top right / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) top right / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom left / 1px var(--s) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / var(--s) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom right / 1px var(--s) no-repeat }
.panel.key::after { --c: var(--accent); --s: 14px }

/* header */
.hdr { position: sticky; top: 0; z-index: 30; background: var(--glass-hdr); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid var(--line) }
.hbar { display: flex; align-items: center; gap: 1.6rem; max-width: var(--max); margin: 0 auto; padding: 0 var(--gut); height: 56px }
.brand { display: flex; align-items: center; gap: .6rem; color: var(--fg); text-decoration: none; font: 600 12px var(--sans); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap }
.brand img { width: 24px; height: 24px; display: block }
.brand span { color: var(--muted); font-weight: 500 }
.nav { display: flex; gap: 1.7rem; flex: 1; min-width: 0; align-self: stretch }
.nav a { position: relative; display: flex; align-items: center; font: 500 11.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .15s }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .22s ease }
.nav a:hover { color: var(--fg-2) } .nav a.on { color: var(--fg) } .nav a.on::after { transform: scaleX(1) }
.hstat { display: inline-flex; align-items: center; gap: .45rem; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); white-space: nowrap; padding: 0 .65rem; height: 30px; border: 1px solid var(--line) }
.hstat i, .dstat i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-2); display: inline-block; flex: none }
.hstat.stale, .dstat.stale { color: var(--accent) } .hstat.stale { border-color: var(--accent) } .hstat.stale i, .dstat.stale i { background: var(--accent) }
.tbtn { background: none; border: 1px solid var(--line); height: 30px; padding: 0 .7rem; font: 500 10.5px var(--mono); letter-spacing: .12em; color: var(--muted); cursor: pointer }
.tbtn:hover { color: var(--fg) }
@media (max-width: 900px) {
  .hbar { flex-wrap: wrap; height: auto; padding-top: 10px; gap: 8px 10px }
  .brand { flex: 1 }
  .nav { order: 3; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; gap: 1.3rem; height: 42px; margin: 0 calc(-1 * var(--gut)); padding: 0 var(--gut) }
  .nav::-webkit-scrollbar { display: none }
  .hs-age, .brand span, .hs-pre { display: none }
  .prov .pd { display: none }
  .contract .full { display: none }
  .hero { gap: 12px }
  .hstat, .tbtn { height: 34px }
}

/* hero + metrics */
.hero { padding: 46px 0 22px; display: grid; gap: 16px }
.sline { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .8rem; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.sline .sep { opacity: .45 }
.dstat { display: inline-flex; align-items: center; gap: .45rem; color: var(--fg-2) }
.hero h1 { margin: 6px 0 0; font: 600 clamp(34px, 5.6vw, 64px)/.98 var(--sans); letter-spacing: .015em; text-transform: uppercase }
.hero h1 span { color: var(--muted); font-weight: 500 }
.lede { margin: 0; font: 400 clamp(15px, 1.5vw, 18px)/1.45 var(--sans); color: var(--fg-2); max-width: 48ch }
.contract { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; font-size: 12px }
.contract .mono { color: var(--fg-2); word-break: break-all }
.contract .shortc { display: none }
@media (max-width: 900px) { .contract .shortc { display: inline } }
.mini { background: none; border: 1px solid var(--line); padding: 0 .55rem; height: 26px; display: inline-flex; align-items: center; font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); cursor: pointer; text-decoration: none; white-space: nowrap }
.mini:hover { color: var(--fg); border-color: var(--line-2) }
.prov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px }
.prov > div { padding: 14px 18px; display: flex; flex-direction: column; gap: 5px }
.prov > div + div { border-left: 1px solid var(--line) }
.prov p { margin: 0; font-size: 13px; color: var(--fg-2) }
.more { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 1px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap }
.more:hover { color: var(--accent) }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden }
.mtoggle + .grid, .metrics + .mtoggle + .grid { margin-top: 14px }
.metrics .m { padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 3px; min-width: 0; box-shadow: 1px 1px 0 var(--line) }
.mk { font: 500 10px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); cursor: help; width: fit-content; border-bottom: 1px dotted var(--line-2) }
.mv { font: 500 22px/1.2 var(--mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.md { font: 400 11.5px/1.35 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mtoggle { display: none }
@media (max-width: 760px) {
  .hero { padding-top: 26px }
  .prov { grid-template-columns: minmax(0, 1fr) } .prov > div + div { border-left: 0; border-top: 1px solid var(--line) }
  .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)) } .metrics .m { padding: 13px 14px } .mv { font-size: 19px } .md { white-space: normal }
  .metrics.collapsed .m.sec { display: none }
  .mtoggle { display: flex; width: 100%; justify-content: center; margin-top: -1px }
}

/* page head, sections, grids */
.phead { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px 28px; padding: 38px 0 20px }
.phead h1 { margin: 8px 0 8px; font: 600 clamp(26px, 3.4vw, 40px)/1.05 var(--sans); letter-spacing: .005em }
.phead p { margin: 0; color: var(--fg-2); max-width: 70ch }
.sect { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1rem; margin: 36px 0 14px; padding-top: 14px; border-top: 1px solid var(--line) }
.sect h2 { margin: 0; font: 600 12.5px var(--sans); letter-spacing: .16em; text-transform: uppercase }
.sect p { margin: 0; color: var(--muted); font-size: 12.5px; flex-basis: 100% }
@media (min-width: 900px) { .sect p { flex-basis: auto } }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.grid + .grid { margin-top: 14px }
.wide { grid-column: 1 / -1 }
@media (max-width: 1100px) { .grid.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 860px) { .grid, .grid.c3 { grid-template-columns: minmax(0, 1fr) } }
main { padding-bottom: 60px }
#view.enter .panel, #view.enter .phead, #view.enter .hero > *, #view.enter .sect { animation: enter .28s ease-out }
@keyframes enter { from { opacity: 0; transform: translateY(6px) } }

/* cards */
.card { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem 1rem; flex-wrap: wrap }
.ph h3 { margin: 0; font: 500 10.5px/1.4 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--fg-2) }
.ph .q { margin: 5px 0 0; font: 500 16px/1.35 var(--sans); color: var(--fg) }
.pv { font: 500 17px/1.2 var(--mono); white-space: nowrap; letter-spacing: -.01em }
.pv small { font-size: 11.5px; margin-left: .45rem }
.sub { margin: 0; color: var(--fg-2); font-size: 13px; max-width: 86ch }
details.about { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px }
details.about summary { cursor: pointer; list-style: none; font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); width: fit-content }
details.about summary::-webkit-details-marker { display: none }
details.about summary::before { content: "+ " } details.about[open] summary::before { content: "− " }
details.about summary:hover { color: var(--fg-2) }
details.about p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; max-width: 90ch }
.chart { position: relative; width: 100%; min-height: 120px }
.chart svg { display: block; width: 100%; overflow: visible }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; font-size: 12px; color: var(--fg-2) }
.legend:empty { display: none }
.legend span { display: inline-flex; align-items: center; gap: .45rem }
.legend i { width: 9px; height: 9px; flex: none }
.legend i.ln { height: 2px; width: 14px }
.legend i.dash { height: 0; width: 16px; border-top: 2px dashed; background: none !important }
.axis text { font-size: 10px; fill: var(--muted) }
.axis line { stroke: var(--line) } .axis .domain { display: none }
.gridl line { stroke: var(--grid) } .gridl .domain { display: none }
.lbl { font: 500 10.5px var(--sans); fill: var(--fg-2) }
.plabel { font: 500 9.5px var(--mono); letter-spacing: .13em; text-transform: uppercase; fill: var(--muted) }
.xhair { stroke: var(--fg-2); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none }
.empty { border: 1px dashed var(--line-2); padding: 18px; display: flex; flex-direction: column; gap: 4px }
.empty p { margin: 0; color: var(--fg-2); font-size: 13px }

/* segmented controls */
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--glass-2); flex: none }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: 0 .75rem; height: 32px; font: 500 10.5px var(--mono); letter-spacing: .1em; color: var(--muted); cursor: pointer; transition: color .15s, background .15s }
.seg button:last-child { border-right: 0 } .seg button:hover { color: var(--fg-2) }
.seg button.on { color: var(--fg); background: var(--accent-2); box-shadow: inset 0 -1px 0 var(--accent) }
@media (max-width: 760px) { .seg button { height: 40px; padding: 0 .65rem } }
.ctl { display: flex; flex-wrap: wrap; gap: .55rem .8rem; align-items: center }
.chip { background: var(--glass-2); border: 1px solid var(--line); padding: 0 .75rem; height: 32px; font: 500 12px var(--sans); color: var(--fg-2); cursor: pointer; transition: border-color .15s, color .15s }
.chip.on { border-color: var(--accent); color: var(--fg) }
.chip b { font: 500 11.5px var(--mono); margin-left: .25rem }
@media (max-width: 760px) { .chip { height: 40px } }
input.q, select.q { background: var(--glass-2); border: 1px solid var(--line); color: var(--fg); padding: 0 .65rem; height: 32px; font: 400 12.5px var(--sans); min-width: 0 }
input.q { width: 15rem; max-width: 100% } select.q { max-width: 100% }
@media (max-width: 760px) { input.q, select.q { height: 40px; width: 100% } }
.subnav { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none }
.subnav::-webkit-scrollbar { display: none }
.subnav a { padding: 11px 16px 10px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s, border-color .2s }
.subnav a:first-child { padding-left: 0 }
.subnav a:hover { color: var(--fg-2) } .subnav a.on { color: var(--fg); border-bottom-color: var(--accent) }

/* primary instrument */
.prim { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px }
.sop { border-left: 1px solid var(--line); padding-left: 20px; display: flex; flex-direction: column }
.sop .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 9px 0; border-bottom: 1px solid var(--line) }
.sop .row span { color: var(--fg-2); font-size: 12.5px }
.sop .row b { font: 500 13px var(--mono); white-space: nowrap }
.sop .read { margin: 14px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--fg) }
@media (max-width: 1050px) { .prim { grid-template-columns: minmax(0, 1fr) } .sop { border-left: 0; border-top: 1px solid var(--line); padding: 6px 0 0 } }

/* status */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem }
.badge { display: inline-flex; align-items: center; gap: .5rem; padding: 0 .75rem; height: 32px; font: 500 12px var(--mono); letter-spacing: .12em; border: 1px solid }
.badge.ACCUMULATING { color: var(--up); border-color: var(--up) }
.badge.HOLDING { color: var(--fg-2); border-color: var(--line-2) }
.badge.SELLING { color: var(--warn); border-color: var(--warn) }
.badge.DISTRIBUTING { color: var(--crit); border-color: var(--crit) }
.trip { font-size: 12.5px; padding: .35rem .65rem; border: 1px dashed var(--line-2); color: var(--fg-2) }
.trip.armed { border-style: solid; border-color: var(--crit); color: var(--crit) }

/* evidence */
.ev { display: inline-flex; align-items: center; font: 500 9.5px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 0 .4rem; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; margin-right: .3rem }
.ev.inf { border-style: dashed; color: var(--muted) }
.evleg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px }
.evleg > div { padding: 14px 18px; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 3px 12px; align-items: start }
.evleg > div + div { border-left: 1px solid var(--line) }
.evleg svg { grid-row: span 2; margin-top: 6px }
.evleg b { font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase }
.evleg p { margin: 0; font-size: 12.5px; color: var(--fg-2) }
.evleg .disc { grid-column: 1 / -1; display: block; border-top: 1px solid var(--line); border-left: 0 !important; padding: 10px 18px; font-size: 12.5px; color: var(--fg-2) }
@media (max-width: 760px) { .evleg { grid-template-columns: minmax(0, 1fr) } .evleg > div + div { border-left: 0; border-top: 1px solid var(--line) } }

/* tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch }
table { border-collapse: collapse; width: 100%; font-size: 12.5px }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle }
th { font: 500 9.5px var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; z-index: 1; background: var(--th) }
th.s { cursor: pointer } th.s:hover { color: var(--fg) }
td.n, th.n { text-align: right }
tr:last-child td { border-bottom: 0 }
tbody tr { transition: background .12s } tbody tr:hover { background: var(--row) }
.addr { font: 500 12px var(--mono); color: var(--fg); cursor: pointer; background: none; border: 0; padding: 0; border-bottom: 1px dotted var(--line-2); transition: color .12s }
.addr:hover { color: var(--accent); border-bottom-color: var(--accent) }
.tag { display: inline-block; font: 500 9.5px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 0 .4rem; border: 1px solid var(--line); color: var(--fg-2); margin-right: .25rem; white-space: nowrap }
.bar { position: relative; height: 4px; background: var(--grid); min-width: 70px }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent) }
.sev { font: 500 10px var(--mono); letter-spacing: .1em }
.sev.high { color: var(--crit) } .sev.medium { color: var(--warn) } .sev.info { color: var(--muted) }
.alist { list-style: none; margin: 0; padding: 0 }

      y = d3.scaleLinear([lo < 0 ? lo - pad : lo, p.yMax ? p.yMax : hi + pad], [h, 0]); if (!p.yMax) y.nice(tickN); }

  const totalH = yo - gap;
  const bis = d3.bisector((d) => d).center, line = root.append("line").attr("class", "xhair").attr("y1", 0).attr("y2", totalH).style("opacity", 0);

function moveKind(m) {

  if (m.tl === "Token contract") return ["To the token contract", "flat", "direct"];
  if (m.fl === "DEX") return ["Bought on DEX", "up", "direct"];
  if (m.tl === "DEX") return ["Sold on DEX", "down", "direct"];
  if (m.tl === "Exchange") return ["Deposit to exchange", "down", "direct"];
  if (m.fl === "Exchange") return ["Exchange withdrawal", "up", "direct"];
  if (m.fl === "Liquidity" || m.tl === "Liquidity") return ["Liquidity", "flat", "direct"];
  if (m.tl === "Burn") return ["Burn", "flat", "direct"];

}
let movesF = "all";

    const rows = Mv.filter(f);

      <div class="tw" style="max-height:520px;overflow-y:auto"><table><thead><tr><th>When (UTC)</th><th>From</th><th>To</th><th class="n">GME</th><th class="n">≈ $</th><th>What it was</th></tr></thead><tbody>` +
      rows.map((m) => { const [k, c, ev] = moveKind(m); return `<tr><td class="num">${m.t.slice(0, 16).replace("T", " ")}</td><td>${end(m.f, m.fl, m.fg)}</td><td>${end(m.to, m.tl, m.tg)}</td><td class="n">${fBb(m.tok)}</td><td class="n">${fU(m.usd)}</td><td class="${c}">${k}${ev === "inferred" ? ' <span class="ev inf">inferred</span>' : ""}</td></tr>`; }).join("") + `</tbody></table></div>`;
    el.onclick = (e) => { const b = e.target.closest("[data-mf2]"); if (b) { movesF = b.dataset.mf2; draw(); } };
  };
  draws.push(draw);

const LINKN = { gme: ["GME transfer", "direct", "Seed or drain: GME moved directly between the two wallets."], eth: ["ETH from focus", "direct", "The focus wallet sent ≥0.1 ETH directly to this wallet."], deposit: ["Shared deposit", "inferred", "Both wallets sent GME to the same exchange deposit address; no transfer between them."] };
function netCard() {
  const G = T.cluster, id = card({ title: "Cluster network", wide: true, q: "Which evidence ties each wallet to the cluster?",
    sub: "Each square is a wallet, sized by GME held. Hover to isolate a wallet and its links; drag to rearrange; tap for its history.",
    note: "Solid lines are direct evidence (a GME seed or drain between the two, or ETH sent by the focus wallet). Dashed lines are inferred (both used the same exchange deposit address). Tier 1 wallets link straight to the focus wallet; tier 2 link to a tier 1 wallet." });
  draws.push(() => {
    const el = $(id); if (!el) return; el.innerHTML = "";
    const mob = mobile(), W = el.clientWidth, H = mob ? 400 : 480;
    const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("height", H).style("touch-action", "pan-y");
    const nodes = G.nodes.map((n) => ({ ...n, id: n.a })), ids = new Set(nodes.map((n) => n.id));
    const links = G.links.filter((l) => ids.has(l.s) && ids.has(l.t)).map((l) => ({ source: l.s, target: l.t, kind: l.kind }));
    const KC = { gme: C("--s1"), deposit: C("--s2"), eth: C("--s3") };

    const sim = d3.forceSimulation(nodes).force("link", d3.forceLink(links).id((d) => d.id).distance(54).strength(0.5)).force("charge", d3.forceManyBody().strength(-55))
      .force("collide", d3.forceCollide((d) => r(d.bal) * 1.2 + 3)).force("x", d3.forceX(W / 2).strength(0.08)).force("y", d3.forceY(H / 2).strength(0.11)).stop();
    for (let i = 0; i < 320; i++) sim.tick();
    const clamp = (d) => { const rr = r(d.bal) + 2; d.x = Math.max(rr, Math.min(W - rr, d.x)); d.y = Math.max(rr, Math.min(H - rr, d.y)); };
    nodes.forEach(clamp);
    const ls = svg.append("g").selectAll("line").data(links).join("line").attr("stroke", (d) => KC[d.kind]).attr("stroke-width", 1.4).attr("stroke-opacity", 0.7).attr("stroke-dasharray", (d) => (d.kind === "deposit" ? "5 4" : null));

    const pos = () => { ls.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      ns.attr("x", (d) => d.x - r(d.bal)).attr("y", (d) => d.y - r(d.bal)); };
    pos();
    const focusOn = (d) => { const nb = new Set([d.id]); links.forEach((l) => { if (l.source.id === d.id) nb.add(l.target.id); if (l.target.id === d.id) nb.add(l.source.id); });
      ls.attr("stroke-opacity", (l) => (l.source.id === d.id || l.target.id === d.id ? 1 : 0.06)); ns.attr("opacity", (n) => (nb.has(n.id) ? 1 : 0.2)); };
    const reset = () => { ls.attr("stroke-opacity", 0.7); ns.attr("opacity", 1); };
    ns.on("pointerenter", (ev, d) => focusOn(d))
      .on("pointermove", (ev, d) => showTip(`<div class="h">${d.id === FOCUS ? "Focus wallet" : "Linked wallet · tier " + d.tier}</div>` + trow("", short(d.id), "") + trow("", "holds", fB(d.bal)) + trow("", "last active", d.last) + d.kinds.map((k) => trow(KC[k], LINKN[k][0], LINKN[k][1])).join(""), ev))
      .on("pointerleave", () => { reset(); hideTip(); }).on("click", (ev, d) => { if (!ev.defaultPrevented) openWallet(d.id); })
      .call(d3.drag().on("start", (ev, d) => { d.fx = d.x; d.fy = d.y; }).on("drag", (ev, d) => { d.x = d.fx = ev.x; d.y = d.fy = ev.y; clamp(d); pos(); hideTip(); }).on("end", (ev, d) => { d.fx = d.fy = null; }));

  });
}

// ---------- METHODOLOGY ----------
function methodology() {
  pageHead("Methodology", "How the terminal is built", "What the data is, how each number is reconstructed, how wallets are tied together, and what none of it can tell you.", false);
  const tx = IDX ? fN(IDX.transfers) : "~470,000";
  add(`<article class="panel doc">
  <section><span class="dn">01 · Source</span><div><h2>Every transfer, from public nodes</h2>
    <p>The terminal reads every ERC-20 Transfer event of the GME contract <code>${TOKEN}</code> (9 decimals, 420.69B supply) since its first transfer at block 19,858,481 on 13 May 2024: ${tx} transfers to date. Logs come from public Ethereum RPC nodes (drpc and mevblocker) through <code>eth_getLogs</code>; both attach each block's timestamp, so no extra lookups are needed. No paid data source is used.</p>
    <p>The full history is stored as an archive and extended once a day. Each run re-pulls the last block it already had and replaces it, so a block can never be counted twice or missed at the seam.</p></div></section>
  <section><span class="dn">02 · Reconstruction</span><div><h2>Balances, cost and age, rebuilt from transfers</h2>
    <p>Replaying every transfer in block order gives each address's balance on every day. A cost engine then treats each wallet as a queue of lots (time, price, amount). A send uses up the oldest lots first, so every coin still held keeps its own buy price and age. From this come realized price, MVRV, supply in profit, SOPR, net realized profit and loss, the cost-basis distribution and the holding-age bands.</p>
    <ul><li>Pools, routers, contracts, labelled exchange wallets and the burn address are left out of holder counts and concentration. Only confirmed labels are used; no address is guessed.</li>
    <li>A DEX buy is GME leaving the Uniswap pools or a router to a wallet; a DEX sell is the reverse. A transfer to the token contract itself is not a sale.</li>
    <li>Contracts are told apart from wallets with <code>eth_getCode</code>. EIP-7702 accounts count as people.</li>
    <li>Uniswap V3 liquidity deposits are liquidity, not sales.</li></ul></div></section>
  <section><span class="dn">03 · Pricing</span><div><h2>Daily prices, applied to each day's transfers</h2>
    <p>GME/USD and ETH/USD are daily closes from DeFiLlama. DeFiLlama stamps each day with the previous day's close, so daily windows are shifted by one day. Each transfer is valued at its day's price; dollar figures are approximations at daily resolution. Coins a wallet received by transfer rather than bought are costed at that day's market price. Market cap is price × 420.69B. Pool liquidity is read live from the Uniswap V2 pair's reserves.</p></div></section>
  <section><span class="dn">04 · Attribution</span><div><h2>When two wallets are treated as one owner</h2>
    <p>Wallets are grouped only when one of these rules holds. Each rule is graded by the kind of evidence behind it.</p>
    <div class="tw"><table><thead><tr><th>Rule</th><th>What links two wallets</th><th>Evidence</th></tr></thead><tbody>
      <tr><td>Seed</td><td>The first GME a wallet ever received (≥$2k) came from the other wallet.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Drain</td><td>A wallet sent ≥90% of its balance (≥$2k) to the other in one transfer.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>ETH funding</td><td>The focus wallet sent ≥0.1 ETH to the other wallet.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Gas link</td><td>One sent the other ≥0.001 ETH, and both are already on the watchlist.</td><td><span class="ev">Direct</span></td></tr>
      <tr><td>Shared deposit address</td><td>Both used the same exchange deposit address. Only when 2 to 10 wallets share it and it forwards ≥95% to an exchange.</td><td><span class="ev inf">Inferred</span></td></tr>
    </tbody></table></div>
    <p>Guards: an address that seeds more than 40 wallets is a hub, so nothing links through it. A group larger than 60 wallets is flagged and never trusted. A shared exchange or relayer funder never links anyone. Tiny “address poisoning” transfers never link anyone. The focus wallet's cluster stops two steps away from the focus wallet.</p>
    <p><b>Direct</b> describes the evidence, a transfer between the two wallets that anyone can check on-chain. It is not proof that one person controls both. <b>Inferred</b> means the link comes from a shared counterparty or a grouping rule, with no transfer between the two.</p>
    <div class="callout">Wallet links are evidence of shared control, not proof of ownership. Groups are a floor, not a ceiling: the rules err toward not merging.</div></div></section>
  <section><span class="dn">05 · Classifications</span><div><h2>How statuses are assigned</h2>
    <ul><li><b>Insider status</b> (focus wallet's cluster, 30 days): DISTRIBUTING if it sent ≥0.05% of supply to exchanges; SELLING if it sold more than it bought on the DEX and shrank; ACCUMULATING if it grew by more than 0.05% of supply; otherwise HOLDING. The tripwire arms on any exchange deposit in 7 days, or a DEX sale by the focus wallet in 30 days.</li>
    <li><b>Wallet monitor</b>: every wallet holding ≥0.1% of supply now or at any point in 90 days, plus its linked side wallets. A status needs a change of at least 0.5% of the wallet's balance. Selling means at least half of what left went to the DEX or an exchange. Moves between wallets of the same owner group are shown as own-wallet moves, not as buying or selling; in the owner view they cancel out.</li>
    <li><b>Quiet accumulators</b>: owners that added ≥0.1% of supply in 90 days and sold under 15% of it.</li>
    <li><b>Buy-and-hide</b>: fresh wallets fed by wallets that bought on the DEX and forwarded ≥80% of it. One counts as “still holding” only if it kept ≥80% of what it received and sold or deposited ≤20%.</li>
    <li><b>Unusual day</b>: transfers or value moved at least 3× the median of the previous 30 days. A display rule that points at days worth inspecting.</li></ul></div></section>
  <section><span class="dn">06 · Limits</span><div><h2>What the data cannot tell you</h2>
    <ul><li>Ethereum only. GME on other chains is not covered (MEXC's GME is the Solana token, not this one).</li>
    <li>What happens inside an exchange is invisible. A deposit is not proof of a sale, and only labelled exchange wallets are recognised; a deposit to an unlabelled address reads as a wallet-to-wallet transfer.</li>
    <li>Owner groups are a lower bound. A wallet funded only through an exchange or another chain cannot be linked from token transfers.</li>
    <li>A wallet that receives coins from a group but meets no linking rule stays outside the group until it does. Until then, the group shows those coins as moved out.</li>
    <li>Dollar values use daily prices. The market is thin, so small trades move the metrics. Every read describes a position, never a buy or sell signal. Nothing here is financial advice.</li></ul></div></section>
  <section><span class="dn">07 · Freshness</span><div><h2>Live index and research are separate</h2>
    <p>The index is rebuilt once a day by a scheduled job (06:23 UTC, often started hours late by GitHub). The header shows when it last ran and turns to “Data stale” after 36 hours without a new run. The last day in every daily chart is partial: it runs up to the latest indexed transfer.</p>
    <p>The written study is a snapshot of ${STUDY_DATE}. The daily run does not update its findings. <a class="more" href="/study.html">Read the full study →</a></p></div></section>
  </article>`);
}

    ["Bought on DEX", fBb(sum("dex-buy")) + " · " + fU(usd("dex-buy"))], ["Sold on DEX", fBb(sum("dex-sell")) + " · " + fU(usd("dex-sell"))], ["To exchanges", fBb(sum("cex-out"))], ["From exchanges", fBb(sum("cex-in"))]];

    <div><span class="eyebrow">Balance and price</span><div class="chart" id="wchart" style="margin-top:6px"></div></div>
    <div><span class="eyebrow">Activity (${w.n}${w.n > w.events.length ? ", latest " + w.events.length : ""})</span>
    <div class="tw" style="margin-top:6px"><table><thead><tr><th>Date</th><th>Action</th><th class="n">GME</th><th class="n">≈ $</th><th>Counterparty</th></tr></thead><tbody>` +
    [...w.events].reverse().map((e) => { const [l, c] = KIND[e[2]] || [e[2], "flat"]; const cp = e[4];
      return `<tr><td class="num">${e[0]}</td><td class="${c}">${l}</td><td class="n">${sgn(e[1], fBb)}</td><td class="n">${fU(e[3])}</td><td>${/dex|lp/.test(e[2]) ? '<span class="flat">pool / router</span>' : WALLETS[cp] ? `<button class="addr" data-addr="${cp}">${short(cp)}</button>` : `<a class="mono" href="${ETH(cp)}" target="_blank" rel="noopener">${short(cp)}</a>`}</td></tr>`; }).join("") +
    `</tbody></table></div></div>`;
  walletChart(w);
}
function closeWallet() { $("scrim").classList.remove("on"); $("drawer").classList.remove("open"); hideTip(); }
function walletChart(w) {
  const el = $("wchart"); if (!el || !w.series.length) return;
  const start = pd(w.series[0][0]), dates = DD.filter((d) => d >= start), bmap = new Map(w.series.map(([d, b]) => [d, b]));
  let b = 0; const bal = dates.map((d) => { const k = fday(d); if (bmap.has(k)) b = bmap.get(k); return Math.max(0, b); });
  const i0 = DD.indexOf(dates[0]), price = col("price").slice(i0);
  const W = el.clientWidth, H = 270, m = { t: 8, r: 10, b: 22, l: 52 }, w2 = W - m.l - m.r, h1 = 140, gap = 28, h2 = H - m.t - m.b - h1 - gap;
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("height", H), g = svg.append("g").attr("transform", `translate(${m.l},${m.t})`);
  const x = d3.scaleUtc(d3.extent(dates), [0, w2]), y = d3.scaleLinear([0, d3.max(bal) * 1.08 || 1], [h1, 0]).nice(3);
  g.append("g").attr("class", "gridl").call(d3.axisLeft(y).ticks(3).tickSize(-w2).tickFormat(""));
  g.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(3).tickFormat((v) => fBb(v)));
  g.append("path").datum(bal).attr("fill", C("--accent")).attr("fill-opacity", 0.18).attr("stroke", C("--accent")).attr("stroke-width", 1.5)
    .attr("d", d3.area().x((v, i) => x(dates[i])).y0(h1).y1((v) => y(v)).curve(d3.curveStepAfter));
  const ev = w.events.filter((e) => /dex-buy|dex-sell|cex-out|cex-in/.test(e[2]));
  const g2 = g.append("g").attr("transform", `translate(0,${h1 + gap})`), pr = price.map((p, i) => [dates[i], p]).filter(([, p]) => p);
  const y2 = d3.scaleLog(d3.extent(pr, (d) => d[1]), [h2, 0]);
  g2.append("text").attr("class", "plabel").attr("y", -8).text("price · ▲ buys ▼ sells");
  g2.append("path").datum(pr).attr("fill", "none").attr("stroke", C("--fg-2")).attr("stroke-width", 1.2).attr("d", d3.line().x((d) => x(d[0])).y((d) => y2(d[1])));
  const pAt = new Map(pr.map(([d, p]) => [fday(d), p]));
  g2.selectAll("path.m").data(ev.filter((e) => pAt.has(e[0]))).join("path")
    .attr("d", () => d3.symbol(d3.symbolTriangle, 40)()).attr("fill", (e) => (/buy|cex-in/.test(e[2]) ? C("--up") : C("--down")))
    .attr("transform", (e) => `translate(${x(pd(e[0]))},${y2(pAt.get(e[0]))}) rotate(${/buy|cex-in/.test(e[2]) ? 0 : 180})`);
  g2.append("g").attr("class", "axis").attr("transform", `translate(0,${h2})`).call(d3.axisBottom(x).ticks(5));
  const bis = d3.bisector((d) => d).center, ln = g.append("line").attr("class", "xhair").attr("y1", 0).attr("y2", h1 + gap + h2).style("opacity", 0);
  svg.append("rect").attr("x", m.l).attr("width", w2).attr("height", H).attr("fill", "transparent").style("touch-action", "pan-y")
    .on("pointermove", (e2) => { const [mx] = d3.pointer(e2, g.node()); const i = Math.max(0, Math.min(dates.length - 1, bis(dates, x.invert(mx)))); ln.attr("x1", x(dates[i])).attr("x2", x(dates[i])).style("opacity", 1);
      showTip(`<div class="h">${fd(dates[i])}</div>` + trow(C("--accent"), "holds", fBb(bal[i])) + trow("", "price", fP(price[i])), e2); })
    .on("pointerleave", () => { ln.style("opacity", 0); hideTip(); });
}
})();
